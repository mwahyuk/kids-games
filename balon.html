<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pecahkan Balon! 🎈</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #74b9ff;
            --bg-end: #a29bfe;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(34px, 6.5vw, 58px);
            margin: 0 0 15px 0;
            color: #ff7675;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(12px, 3vw, 20px);
            max-width: 600px;
            margin-bottom: 25px;
        }

        .picker-card {
            width: clamp(120px, 25vw, 160px);
            height: clamp(80px, 16vw, 100px);
            background: white;
            border: 4px solid #74b9ff;
            border-radius: 24px;
            font-size: clamp(22px, 4vw, 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .picker-card.selected {
            background: #ffeaa7;
            border-color: #ff7675;
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(255, 118, 117, 0.4);
        }

        .btn {
            background: white;
            border: 4px solid #74b9ff;
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: #2d3436;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 #0984e3;
            transition: transform 0.1s;
            width: clamp(220px, 60vw, 300px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #0984e3; }

        .btn.btn-primary {
            background: #ff7675;
            color: white;
            border-color: #d63031;
            box-shadow: 0 6px 0 #b2bec3;
        }

        /* Target Instruction Banner */
        #instruction-banner {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 4px solid #ff7675;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: clamp(22px, 4.5vw, 34px);
            font-weight: bold;
            color: #d63031;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        #target-icon {
            font-size: clamp(30px, 6vw, 45px);
            animation: pulse 1s infinite alternate;
        }

        #score-board {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            font-size: clamp(20px, 3.8vw, 28px);
            color: white;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 24px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Mode Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Pecahkan Balon! 🎈</h1>
            <p style="font-size: clamp(20px, 4vw, 28px); color: white; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.4);">
                Pilih petunjuk permainan yang ingin kamu mainkan:
            </p>

            <div class="picker-grid" id="mode-grid">
                <div class="picker-card selected" onclick="selectMode('emoji', this)">
                    <span>🐱 Gambar</span>
                </div>
                <div class="picker-card" onclick="selectMode('number', this)">
                    <span>🔢 Angka</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startGame()">Mulai Main! 🎈</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="instruction-banner">
                <span>Pecahkan: </span>
                <span id="target-label">🐱 Kucing</span>
                <span id="target-icon">🐱</span>
            </div>
            <div id="score-board">Skor: <span id="score-val">0</span> ⭐</div>
            <canvas id="balloon-canvas"></canvas>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');

        // Confetti Canvas
        const confCanvas = document.getElementById('confetti-canvas');
        const confCtx = confCanvas.getContext('2d');
        let particles = [];

        const modeData = {
            emoji: [
                { val: '🐱', label: 'Kucing' },
                { val: '🐶', label: 'Anjing' },
                { val: '🐰', label: 'Kelinci' },
                { val: '🐸', label: 'Katak' },
                { val: '🐼', label: 'Panda' },
                { val: '🐻', label: 'Beruang' },
                { val: '🦖', label: 'Dino' },
                { val: '🍎', label: 'Apel' },
                { val: '🚀', label: 'Roket' },
                { val: '⭐', label: 'Bintang' }
            ],
            number: [
                { val: '1', label: 'Angka 1' },
                { val: '2', label: 'Angka 2' },
                { val: '3', label: 'Angka 3' },
                { val: '4', label: 'Angka 4' },
                { val: '5', label: 'Angka 5' },
                { val: '6', label: 'Angka 6' },
                { val: '7', label: 'Angka 7' },
                { val: '8', label: 'Angka 8' },
                { val: '9', label: 'Angka 9' },
                { val: '10', label: 'Angka 10' }
            ]
        };

        let currentMode = 'emoji';
        let currentTarget = null;
        let balloons = [];
        let score = 0;
        let animId = null;
        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#fdcb6e'];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectMode(mode, cardEl) {
            currentMode = mode;
            document.querySelectorAll('.picker-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            playAudioTone(600, 0.1);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startGame() {
            score = 0;
            document.getElementById('score-val').innerText = score;
            showScreen('game-screen');
            setNewTargetInstruction();
            spawnBalloons();
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function setNewTargetInstruction() {
            const list = modeData[currentMode];
            currentTarget = list[Math.floor(Math.random() * list.length)];
            
            document.getElementById('target-label').innerText = currentTarget.label;
            document.getElementById('target-icon').innerText = currentTarget.val;
        }

        function spawnBalloons() {
            balloons = [];
            // Spawn 5 balloons (guaranteeing at least 2 match target)
            for (let i = 0; i < 5; i++) {
                const isTarget = i < 2;
                createBalloon(isTarget);
            }
        }

        function createBalloon(isTarget = false) {
            const r = Math.random() * 25 + 40; // Gentle big balloons for kids
            const list = modeData[currentMode];
            let item;

            if (isTarget) {
                item = currentTarget;
            } else {
                let pool = list.filter(x => x.val !== currentTarget.val);
                item = pool[Math.floor(Math.random() * pool.length)];
            }

            // GENTLE SLOW SPEED for kids (0.7 to 1.3 px/frame)
            balloons.push({
                x: Math.random() * (canvas.width - r * 2) + r,
                y: canvas.height + r + Math.random() * 150,
                r: r,
                speed: Math.random() * 0.6 + 0.7, 
                color: colors[Math.floor(Math.random() * colors.length)],
                val: item.val,
                label: item.label,
                isTarget: item.val === currentTarget.val
            });
        }

        function loop() {
            if (!document.getElementById('game-screen').classList.contains('active')) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            balloons.forEach((b) => {
                b.y -= b.speed;
                if (b.y < -b.r * 2) {
                    b.y = canvas.height + b.r;
                    b.x = Math.random() * (canvas.width - b.r * 2) + b.r;
                    b.isTarget = (b.val === currentTarget.val);
                }

                // Balloon String
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.r);
                ctx.lineTo(b.x, b.y + b.r + 30);
                ctx.strokeStyle = 'rgba(255,255,255,0.75)';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Balloon Body
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Shine Highlight
                ctx.beginPath();
                ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.fill();

                // Label/Icon inside Balloon
                ctx.fillStyle = '#2d3436';
                ctx.font = `bold ${b.r * (currentMode === 'number' ? 0.75 : 0.85)}px Bubblegum Sans, Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.val, b.x, b.y);
            });

            animId = requestAnimationFrame(loop);
        }

        function popAt(clientX, clientY) {
            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                const dist = Math.hypot(clientX - b.x, clientY - b.y);
                if (dist < b.r + 15) {
                    if (b.val === currentTarget.val) {
                        // Correct Target Balloon Popped!
                        playAudioTone(880, 0.2);
                        spawnConfettiAt(b.x, b.y);
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        balloons.splice(i, 1);
                        createBalloon(true);

                        // Every 3 correct pops, update to a new target instruction!
                        if (score % 30 === 0) {
                            setNewTargetInstruction();
                        }
                    } else {
                        // Wrong balloon tapped -> soft boing sound
                        playAudioTone(220, 0.15);
                    }
                    break;
                }
            }
        }

        canvas.addEventListener('click', (e) => popAt(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            popAt(touch.clientX, touch.clientY);
        }, {passive: true});

        function playAudioTone(freq, dur) {
            try {
                const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.connect(gain); gain.connect(ctxAudio.destination);
                osc.frequency.setValueAtTime(freq, ctxAudio.currentTime);
                gain.gain.setValueAtTime(0.2, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + dur);
                osc.start(); osc.stop(ctxAudio.currentTime + dur);
            } catch(e) {}
        }

        function spawnConfettiAt(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 1) * 12 - 2,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
            renderConfetti();
        }

        function renderConfetti() {
            confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
            let active = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                if (p.y < confCanvas.height) active = true;
                confCtx.fillStyle = p.color;
                confCtx.fillRect(p.x, p.y, p.size, p.size);
            });
            if (active) requestAnimationFrame(renderConfetti);
            else particles = [];
        }
    </script>
</body>
</html>
