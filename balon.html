<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pecahkan Balonnya! 🎈</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(180deg, #74b9ff 0%, #a29bfe 100%);
            color: #2d3436;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #ff7675;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        .btn {
            background: white;
            border: 4px solid #74b9ff;
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: #2d3436;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 #0984e3;
            transition: transform 0.1s;
            width: clamp(220px, 60vw, 300px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #0984e3; }

        .btn.btn-primary {
            background: #ff7675;
            color: white;
            border-color: #d63031;
            box-shadow: 0 6px 0 #b2bec3;
        }

        #score-board {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            font-size: clamp(22px, 4.5vw, 32px);
            color: white;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 24px;
            z-index: 100;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Pecahkan Balonnya! 🎈</h1>
            <p style="font-size: clamp(20px, 4vw, 28px); color: white; margin-bottom: 25px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Sentuh atau klik balon yang terbang di langit!</p>
            <button class="btn btn-primary" onclick="startGame()">Mulai Main! 🎈</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="score-board">Skor: <span id="score-val">0</span></div>
            <canvas id="balloon-canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');
        let balloons = [];
        let score = 0;
        let animId = null;
        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
        const emojis = ['⭐', '🎈', '🎉', '🍎', '🐱', '🦖'];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startGame() {
            score = 0;
            document.getElementById('score-val').innerText = score;
            showScreen('game-screen');
            spawnBalloons();
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function spawnBalloons() {
            balloons = [];
            for (let i = 0; i < 7; i++) {
                createBalloon();
            }
        }

        function createBalloon() {
            const r = Math.random() * 25 + 35;
            balloons.push({
                x: Math.random() * (canvas.width - r * 2) + r,
                y: canvas.height + r + Math.random() * 200,
                r: r,
                speed: Math.random() * 2 + 1.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                emoji: emojis[Math.floor(Math.random() * emojis.length)]
            });
        }

        function loop() {
            if (!document.getElementById('game-screen').classList.contains('active')) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            balloons.forEach((b, idx) => {
                b.y -= b.speed;
                if (b.y < -b.r * 2) {
                    b.y = canvas.height + b.r;
                    b.x = Math.random() * (canvas.width - b.r * 2) + b.r;
                }

                // Draw Balloon Body
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Emoji inside balloon
                ctx.font = `${b.r * 0.9}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.emoji, b.x, b.y);

                // String line
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.r);
                ctx.lineTo(b.x, b.y + b.r + 25);
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            animId = requestAnimationFrame(loop);
        }

        function popAt(clientX, clientY) {
            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                const dist = Math.hypot(clientX - b.x, clientY - b.y);
                if (dist < b.r + 15) {
                    playPopSound();
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    balloons.splice(i, 1);
                    createBalloon();
                    break;
                }
            }
        }

        canvas.addEventListener('click', (e) => popAt(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            popAt(touch.clientX, touch.clientY);
        }, {passive: true});

        function playPopSound() {
            try {
                const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.connect(gain); gain.connect(ctxAudio.destination);
                osc.frequency.setValueAtTime(800, ctxAudio.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctxAudio.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.1);
                osc.start(); osc.stop(ctxAudio.currentTime + 0.1);
            } catch(e) {}
        }
    </script>
</body>
</html>
