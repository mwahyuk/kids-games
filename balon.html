<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pecahkan Balon! 🎈</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #74b9ff;
            --bg-end: #a29bfe;
            --primary: #ff7675;
            --secondary: #fdcb6e;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #ffeaa7;
            text-shadow: 3px 3px 0px #d63031, -3px -3px 0px #d63031, 3px -3px 0px #d63031, -3px 3px 0px #d63031;
            animation: bounce 2s infinite ease-in-out;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(14px, 3.5vw, 24px);
            max-width: 650px;
            margin-bottom: 25px;
        }

        .picker-card {
            width: clamp(110px, 22vw, 150px);
            height: clamp(110px, 22vw, 150px);
            background: white;
            border: 4px solid #fdcb6e;
            border-radius: 32px;
            font-size: clamp(48px, 9vw, 68px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 0 #d4af37, 0 12px 20px rgba(0,0,0,0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 8px;
        }

        .picker-card span {
            font-size: clamp(15px, 2.8vw, 20px);
            font-weight: bold;
            color: #2d3436;
            margin-top: 4px;
            background: #ffeaa7;
            padding: 4px 14px;
            border-radius: 14px;
            border: 2px solid #fdcb6e;
        }

        .picker-card:hover { transform: scale(1.08); }
        .picker-card.selected {
            background: #ffe082;
            border-color: #ff7675;
            transform: scale(1.15);
            box-shadow: 0 8px 0 #e17055, 0 0 25px rgba(255, 118, 117, 0.5);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: #2d3436;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--secondary); }

        #instruction-banner {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            background: white;
            border: 4px solid #ff7675;
            border-radius: 28px;
            padding: 8px 24px;
            font-size: clamp(22px, 4.5vw, 34px);
            color: #d63031;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #score-board {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: clamp(18px, 3.5vw, 26px);
            color: #ffeaa7;
            z-index: 100;
        }

        #balloon-canvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 900;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Mode Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Pecahkan Balon! 🎈</h1>
            <p style="font-size: clamp(20px, 4vw, 28px); color: white; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.4);">
                Pilih petunjuk permainan yang ingin kamu mainkan:
            </p>

            <div class="picker-grid" id="mode-grid">
                <div class="picker-card selected" onclick="selectMode('emoji', this)">
                    🐱<span>Gambar 3D</span>
                </div>
                <div class="picker-card" onclick="selectMode('number', this)">
                    🔢<span>Angka 3D</span>
                </div>
            </div>

            <button class="btn" style="background: #fdcb6e; font-weight: bold;" onclick="startGame()">Mulai Main! 🎈</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="instruction-banner">
                <span>Pecahkan: </span>
                <span id="target-label">🐱 Kucing</span>
                <span id="target-icon">🐱</span>
            </div>
            <div id="score-board">Skor: <span id="score-val">0</span> ⭐</div>
            <canvas id="balloon-canvas"></canvas>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');

        const confCanvas = document.getElementById('confetti-canvas');
        const confCtx = confCanvas.getContext('2d');
        let particles = [];

        const modeData = {
            emoji: [
                { val: '🐱', label: 'Kucing 3D' },
                { val: '🐶', label: 'Anjing 3D' },
                { val: '🐰', label: 'Kelinci 3D' },
                { val: '🐸', label: 'Katak 3D' },
                { val: '🐼', label: 'Panda 3D' },
                { val: '🐻', label: 'Beruang 3D' },
                { val: '🦖', label: 'Dino 3D' },
                { val: '🍎', label: 'Apel 3D' },
                { val: '🚀', label: 'Roket 3D' },
                { val: '⭐', label: 'Bintang 3D' }
            ],
            number: [
                { val: '1', label: 'Angka 1' },
                { val: '2', label: 'Angka 2' },
                { val: '3', label: 'Angka 3' },
                { val: '4', label: 'Angka 4' },
                { val: '5', label: 'Angka 5' },
                { val: '6', label: 'Angka 6' },
                { val: '7', label: 'Angka 7' },
                { val: '8', label: 'Angka 8' },
                { val: '9', label: 'Angka 9' },
                { val: '10', label: 'Angka 10' }
            ]
        };

        let currentMode = 'emoji';
        let currentTarget = null;
        let balloons = [];
        let score = 0;
        let animId = null;
        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#fdcb6e'];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectMode(mode, cardEl) {
            currentMode = mode;
            document.querySelectorAll('.picker-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            playAudioTone(600, 0.1);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startGame() {
            score = 0;
            document.getElementById('score-val').innerText = score;
            showScreen('game-screen');
            setNewTargetInstruction();
            spawnBalloons();
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function setNewTargetInstruction() {
            const list = modeData[currentMode];
            currentTarget = list[Math.floor(Math.random() * list.length)];
            
            if (currentMode === 'number') {
                document.getElementById('target-label').innerText = 'Angka';
                document.getElementById('target-icon').innerText = currentTarget.val;
            } else {
                document.getElementById('target-label').innerText = currentTarget.label;
                document.getElementById('target-icon').innerText = currentTarget.val;
            }
        }

        function spawnBalloons() {
            balloons = [];
            const count = 6;
            const list = modeData[currentMode];

            let targetBalloonAdded = false;

            for (let i = 0; i < count; i++) {
                let item = list[Math.floor(Math.random() * list.length)];
                if (i === 0 || (!targetBalloonAdded && i === count - 1)) {
                    item = currentTarget;
                    targetBalloonAdded = true;
                }

                balloons.push({
                    x: Math.random() * (canvas.width - 120) + 60,
                    y: canvas.height + Math.random() * 300 + 50,
                    r: Math.random() * 12 + 38,
                    speed: Math.random() * 0.6 + 0.7,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    item: item,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.03 + 0.01
                });
            }
        }

        function playAudioTone(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let targetOnScreen = false;

            balloons.forEach((b, index) => {
                b.y -= b.speed;
                b.sway += b.swaySpeed;
                b.x += Math.sin(b.sway) * 0.8;

                if (b.item.val === currentTarget.val && b.y > -b.r * 2) {
                    targetOnScreen = true;
                }

                if (b.y < -b.r * 2) {
                    b.y = canvas.height + 50;
                    b.x = Math.random() * (canvas.width - 120) + 60;
                }

                // Render 3D Glossy Balloon
                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                
                let grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, b.color);
                grad.addColorStop(1, '#2d3436');
                
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.stroke();

                // Balloon Shine Highlight
                ctx.beginPath();
                ctx.ellipse(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, b.r * 0.15, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();

                // Balloon String
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.r);
                ctx.quadraticCurveTo(b.x + Math.sin(b.sway) * 10, b.y + b.r + 20, b.x, b.y + b.r + 35);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Item Text/Emoji inside Balloon
                ctx.font = `${b.r * 0.9}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#2d3436';
                ctx.fillText(b.item.val, b.x, b.y);
                ctx.restore();
            });

            if (!targetOnScreen) {
                if (balloons.length > 0) {
                    balloons[0].item = currentTarget;
                }
            }

            renderConfetti();
            animId = requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', handlePop);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handlePop({ clientX: touch.clientX, clientY: touch.clientY });
        });

        function handlePop(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                let dist = Math.hypot(x - b.x, y - b.y);
                
                if (dist < b.r + 15) {
                    if (b.item.val === currentTarget.val) {
                        playAudioTone(1200, 0.2);
                        spawnConfettiAt(b.x, b.y);
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        setNewTargetInstruction();
                    } else {
                        playAudioTone(300, 0.15);
                    }

                    b.y = canvas.height + 100;
                    b.x = Math.random() * (canvas.width - 120) + 60;
                    break;
                }
            }
        }

        function spawnConfettiAt(x, y) {
            const colorsConf = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 8 + 6,
                    color: colorsConf[Math.floor(Math.random() * colorsConf.length)]
                });
            }
        }

        function renderConfetti() {
            confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.size *= 0.95;

                confCtx.fillStyle = p.color;
                confCtx.fillRect(p.x, p.y, p.size, p.size);

                if (p.size < 0.5) particles.splice(i, 1);
            }
        }

        selectMode('emoji', document.querySelector('.picker-card'));
    </script>
</body>
</html>
