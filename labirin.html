<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bantu Temannya! 🌟</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #ccff90;
            --bg-end: #ffff8d;
            --primary: #ff80ab;
            --secondary: #8c9eff;
            --text: #37474f;
            --wall: #b388ff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        #screens {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #ff4081;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        h2 {
            font-size: clamp(22px, 3.8vw, 32px);
            color: #5c6bc0;
            margin: 8px 0 12px;
            text-shadow: 1px 1px 0 #fff;
        }

        /* Selection Card Grid */
        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 18px);
            max-width: 700px;
            margin-bottom: 16px;
        }

        .picker-card {
            width: clamp(65px, 14vw, 95px);
            height: clamp(65px, 14vw, 95px);
            background: white;
            border: 4px solid #b388ff;
            border-radius: 24px;
            font-size: clamp(38px, 7.5vw, 55px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .picker-card:hover {
            transform: scale(1.1);
        }

        .picker-card.selected {
            background: #ffe082;
            border-color: #ff4081;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.4);
        }

        .picker-card:active {
            transform: scale(0.95);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s, box-shadow 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--secondary);
        }

        .btn.btn-primary {
            background: #ff80ab;
            color: white;
            border-color: #ff4081;
            box-shadow: 0 6px 0 #c60055;
        }
        .btn.btn-primary:active {
            box-shadow: 0 0 0 #c60055;
        }

        #game-container {
            position: relative;
            width: clamp(280px, 78vmin, 620px);
            height: clamp(280px, 78vmin, 620px);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 10px;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 14px;
        }

        #hint-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 65px;
            height: 65px;
            background: white;
            border: 4px solid #ffeb3b;
            border-radius: 50%;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #fbc02d;
            z-index: 10;
        }

        #hint-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #fbc02d;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .celeb-text {
            font-size: clamp(50px, 10vw, 75px);
            color: #00e676;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 white;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .emoji-showcase {
            font-size: clamp(60px, 12vw, 100px);
            margin: 15px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Character & Goal Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Bantu Temannya! 🌟</h1>
            
            <h2>1. Pilih Karakter:</h2>
            <div class="picker-grid" id="char-grid"></div>

            <h2>2. Pilih Hadiah Target:</h2>
            <div class="picker-grid" id="goal-grid"></div>

            <h2>3. Pilih Tingkat Kesulitan:</h2>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
                <button class="btn" onclick="startGame(5)">⭐ Mudah</button>
                <button class="btn" onclick="startGame(7)">⭐⭐ Sedang</button>
                <button class="btn" onclick="startGame(9)">⭐⭐⭐ Sulit</button>
            </div>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-container">
                <canvas id="game-canvas"></canvas>
                <div id="hint-btn" onclick="showHint()">💡</div>
            </div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <div class="celeb-text">Horeee! 🎉</div>
            <div class="emoji-showcase" id="celeb-emoji">🐱❤️⭐</div>
            <button class="btn btn-primary" onclick="nextLevel()">Main Lagi!</button>
            <button class="btn" onclick="showScreen('start-screen')">Ganti Karakter</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const chars = [
            { id: 'cat', emoji: '🐱', name: 'Kucing' },
            { id: 'dog', emoji: '🐶', name: 'Anjing' },
            { id: 'dino1', emoji: '🦖', name: 'T-Rex' },
            { id: 'dino2', emoji: '🦕', name: 'Dino Brachio' },
            { id: 'rabbit', emoji: '🐰', name: 'Kelinci' },
            { id: 'frog', emoji: '🐸', name: 'Katak' },
            { id: 'panda', emoji: '🐼', name: 'Panda' },
            { id: 'bear', emoji: '🐻', name: 'Beruang' },
            { id: 'fox', emoji: '🦊', name: 'Rubah' },
            { id: 'unicorn', emoji: '🦄', name: 'Unicorn' }
        ];

        const goals = [
            { id: 'star', emoji: '⭐', name: 'Bintang' },
            { id: 'apple', emoji: '🍎', name: 'Apel' },
            { id: 'cookie', emoji: '🍪', name: 'Biskuit' },
            { id: 'gift', emoji: '🎁', name: 'Kado' },
            { id: 'trophy', emoji: '🏆', name: 'Piala' },
            { id: 'gem', emoji: '💎', name: 'Permata' },
            { id: 'cheese', emoji: '🧀', name: 'Keju' },
            { id: 'carrot', emoji: '🥕', name: 'Wortel' }
        ];

        let selectedChar = chars[0].emoji;
        let selectedGoal = goals[0].emoji;

        // Render Character and Goal Selection Cards
        function renderPickers() {
            const charGrid = document.getElementById('char-grid');
            const goalGrid = document.getElementById('goal-grid');
            charGrid.innerHTML = '';
            goalGrid.innerHTML = '';

            chars.forEach((c) => {
                const card = document.createElement('div');
                card.className = `picker-card ${c.emoji === selectedChar ? 'selected' : ''}`;
                card.innerText = c.emoji;
                card.title = c.name;
                card.onclick = () => {
                    AudioSys.playOsc('sine', 600, 0.1);
                    selectedChar = c.emoji;
                    renderPickers();
                };
                charGrid.appendChild(card);
            });

            goals.forEach((g) => {
                const card = document.createElement('div');
                card.className = `picker-card ${g.emoji === selectedGoal ? 'selected' : ''}`;
                card.innerText = g.emoji;
                card.title = g.name;
                card.onclick = () => {
                    AudioSys.playOsc('sine', 800, 0.1);
                    selectedGoal = g.emoji;
                    renderPickers();
                };
                goalGrid.appendChild(card);
            });
        }

        // Audio System
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playOsc(type, freq, duration, vol=0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            step() {
                this.init();
                this.playOsc('sine', 400 + Math.random()*100, 0.1, 0.05);
            },
            hint() {
                this.init();
                this.playOsc('sine', 800, 0.2, 0.05);
                setTimeout(() => this.playOsc('sine', 1200, 0.3, 0.05), 100);
            },
            win() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        this.playOsc('triangle', freq, 0.3, 0.1);
                    }, i * 150);
                });
            }
        };

        // Confetti System
        const Confetti = {
            canvas: document.getElementById('confetti-canvas'),
            ctx: null,
            particles: [],
            colors: ['#ff80ab', '#8c9eff', '#b388ff', '#ffeb3b', '#00e676'],
            animId: null,
            start() {
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                for(let i=0; i<100; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 2,
                        vx: (Math.random() - 0.5) * 20,
                        vy: (Math.random() - 1) * 20 - 5,
                        size: Math.random() * 10 + 10,
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.2
                    });
                }
                this.loop();
            },
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                let active = false;
                
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5;
                    p.rot += p.rotSpeed;
                    
                    if (p.y < this.canvas.height) active = true;
                    
                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate(p.rot);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    this.ctx.restore();
                });
                
                if (active) {
                    this.animId = requestAnimationFrame(() => this.loop());
                } else {
                    this.stop();
                }
            },
            stop() {
                cancelAnimationFrame(this.animId);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles = [];
            }
        };

        // Game State & Logic
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let gridSize = 5;
        let cellSize = 0;
        let cells = [];
        let player = { x: 0, y: 0, animX: 0, animY: 0 };
        let charEmoji = selectedChar;
        let goalEmoji = selectedGoal;
        let isAnimating = false;
        let trail = [];
        let hintPath = [];
        let hintTimer = 0;
        let gameLoopId = null;
        let bouncePhase = 0;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame(size) {
            AudioSys.init();
            gridSize = size;
            charEmoji = selectedChar;
            goalEmoji = selectedGoal;
            showScreen('game-screen');
            initMaze();
        }

        function nextLevel() {
            startGame(gridSize);
        }

        function initMaze() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            cellSize = canvas.width / gridSize;

            cells = [];
            for (let y = 0; y < gridSize; y++) {
                let row = [];
                for (let x = 0; x < gridSize; x++) {
                    row.push({ x, y, walls: [true, true, true, true], visited: false });
                }
                cells.push(row);
            }

            const stack = [];
            let current = cells[0][0];
            current.visited = true;

            let unvisitedCount = gridSize * gridSize - 1;
            
            while (unvisitedCount > 0) {
                const neighbors = [];
                const x = current.x;
                const y = current.y;
                
                if (y > 0 && !cells[y-1][x].visited) neighbors.push({cell: cells[y-1][x], dir: 0, opp: 2});
                if (x < gridSize-1 && !cells[y][x+1].visited) neighbors.push({cell: cells[y][x+1], dir: 1, opp: 3});
                if (y < gridSize-1 && !cells[y+1][x].visited) neighbors.push({cell: cells[y+1][x], dir: 2, opp: 0});
                if (x > 0 && !cells[y][x-1].visited) neighbors.push({cell: cells[y][x-1], dir: 3, opp: 1});

                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    current.walls[next.dir] = false;
                    next.cell.walls[next.opp] = false;
                    stack.push(current);
                    current = next.cell;
                    current.visited = true;
                    unvisitedCount--;
                } else if (stack.length > 0) {
                    current = stack.pop();
                }
            }

            player = { x: 0, y: 0, animX: 0, animY: 0 };
            trail = [{x:0, y:0}];
            hintPath = [];
            hintTimer = 0;
            bouncePhase = 0;

            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function findPath() {
            const queue = [[player.x, player.y]];
            const prev = {};
            const visited = new Set();
            visited.add(`${player.x},${player.y}`);
            
            while (queue.length > 0) {
                const [cx, cy] = queue.shift();
                if (cx === gridSize-1 && cy === gridSize-1) break;
                
                const cell = cells[cy][cx];
                const neighbors = [
                    { nx: cx, ny: cy-1, wall: 0 },
                    { nx: cx+1, ny: cy, wall: 1 },
                    { nx: cx, ny: cy+1, wall: 2 },
                    { nx: cx-1, ny: cy, wall: 3 }
                ];
                
                for (let n of neighbors) {
                    if (!cell.walls[n.wall] && n.nx>=0 && n.nx<gridSize && n.ny>=0 && n.ny<gridSize) {
                        const key = `${n.nx},${n.ny}`;
                        if (!visited.has(key)) {
                            visited.add(key);
                            prev[key] = {x: cx, y: cy};
                            queue.push([n.nx, n.ny]);
                        }
                    }
                }
            }
            
            let path = [];
            let curr = `${gridSize-1},${gridSize-1}`;
            while(curr !== `${player.x},${player.y}`) {
                let coords = curr.split(',').map(Number);
                path.push({x: coords[0], y: coords[1]});
                let p = prev[curr];
                if(!p) break;
                curr = `${p.x},${p.y}`;
            }
            path.push({x: player.x, y: player.y});
            return path.reverse();
        }

        function showHint() {
            AudioSys.hint();
            hintPath = findPath();
            hintTimer = 120;
        }

        function movePlayer(dx, dy) {
            if (isAnimating) return;
            
            const nx = player.x + dx;
            const ny = player.y + dy;
            
            if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) return;
            
            const cell = cells[player.y][player.x];
            let canMove = false;
            
            if (dy === -1 && !cell.walls[0]) canMove = true;
            if (dx === 1 && !cell.walls[1]) canMove = true;
            if (dy === 1 && !cell.walls[2]) canMove = true;
            if (dx === -1 && !cell.walls[3]) canMove = true;
            
            if (canMove) {
                isAnimating = true;
                AudioSys.step();
                
                if (trail.length > 1 && trail[trail.length-2].x === nx && trail[trail.length-2].y === ny) {
                    trail.pop();
                } else {
                    trail.push({x: nx, y: ny});
                }
                
                const frames = 10;
                let f = 0;
                const startX = player.x;
                const startY = player.y;
                
                function animate() {
                    f++;
                    player.animX = startX + (nx - startX) * (f / frames);
                    player.animY = startY + (ny - startY) * (f / frames);
                    
                    if (f < frames) {
                        requestAnimationFrame(animate);
                    } else {
                        player.x = nx;
                        player.y = ny;
                        player.animX = nx;
                        player.animY = ny;
                        isAnimating = false;
                        checkWin();
                    }
                }
                animate();
            }
        }

        function checkWin() {
            if (player.x === gridSize - 1 && player.y === gridSize - 1) {
                AudioSys.win();
                setTimeout(() => {
                    document.getElementById('celeb-emoji').innerText = `${charEmoji} ❤️ ${goalEmoji}`;
                    showScreen('celeb-screen');
                    Confetti.start();
                }, 300);
            }
        }

        function gameLoop() {
            if (document.getElementById('game-screen').classList.contains('active')) {
                render();
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const wallWidth = canvas.width * 0.03;
            const hw = wallWidth / 2;
            
            // Draw Trail Line
            if (trail.length > 1) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo((trail[0].x + 0.5) * cellSize, (trail[0].y + 0.5) * cellSize);
                for(let i=1; i<trail.length; i++) {
                    ctx.lineTo((trail[i].x + 0.5) * cellSize, (trail[i].y + 0.5) * cellSize);
                }
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#ff80ab');
                grad.addColorStop(0.5, '#ffff8d');
                grad.addColorStop(1, '#8c9eff');
                ctx.strokeStyle = grad;
                ctx.lineWidth = cellSize * 0.26;
                ctx.globalAlpha = 0.5;
                ctx.stroke();

                // Draw Path Dots (Titik-Titik Pathway)
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.85;
                for(let i=0; i<trail.length; i++) {
                    ctx.beginPath();
                    ctx.arc((trail[i].x + 0.5) * cellSize, (trail[i].y + 0.5) * cellSize, cellSize * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }

            // Draw Hint
            if (hintTimer > 0) {
                hintTimer--;
                if (hintPath.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo((hintPath[0].x + 0.5) * cellSize, (hintPath[0].y + 0.5) * cellSize);
                    for(let i=1; i<hintPath.length; i++) {
                        ctx.lineTo((hintPath[i].x + 0.5) * cellSize, (hintPath[i].y + 0.5) * cellSize);
                    }
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = cellSize * 0.2;
                    ctx.globalAlpha = (hintTimer / 120) * 0.8;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            }
            
            // Draw Walls
            ctx.fillStyle = '#b388ff';
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cx = x * cellSize;
                    const cy = y * cellSize;
                    const cell = cells[y][x];
                    
                    if (cell.walls[0]) ctx.fillRect(cx - hw, cy - hw, cellSize + wallWidth, wallWidth);
                    if (cell.walls[1]) ctx.fillRect(cx + cellSize - hw, cy - hw, wallWidth, cellSize + wallWidth);
                    if (cell.walls[2]) ctx.fillRect(cx - hw, cy + cellSize - hw, cellSize + wallWidth, wallWidth);
                    if (cell.walls[3]) ctx.fillRect(cx - hw, cy - hw, wallWidth, cellSize + wallWidth);
                }
            }

            // Draw Goal
            ctx.font = `${cellSize * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const pulse = 1 + Math.sin(Date.now() / 200) * 0.1;
            ctx.save();
            ctx.translate((gridSize - 0.5) * cellSize, (gridSize - 0.5) * cellSize);
            ctx.scale(pulse, pulse);
            ctx.fillText(goalEmoji, 0, 0);
            ctx.restore();

            // Draw Player
            bouncePhase += 0.1;
            const bounceY = Math.abs(Math.sin(bouncePhase)) * cellSize * 0.1;
            
            const px = (player.animX || player.x) * cellSize + cellSize * 0.5;
            const py = (player.animY || player.y) * cellSize + cellSize * 0.5 - bounceY;
            
            ctx.font = `${cellSize * 0.6}px Arial`;
            ctx.fillText(charEmoji, px, py);
        }

        window.addEventListener('keydown', (e) => {
            if(document.getElementById('game-screen').classList.contains('active')) {
                if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
                if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
                if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
                if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            if(document.getElementById('game-screen').classList.contains('active')) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }
        }, {passive: true});

        canvas.addEventListener('touchend', (e) => {
            if(!document.getElementById('game-screen').classList.contains('active')) return;
            
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    movePlayer(dx > 0 ? 1 : -1, 0);
                } else {
                    movePlayer(0, dy > 0 ? 1 : -1);
                }
            } else {
                const rect = canvas.getBoundingClientRect();
                const tapX = (e.changedTouches[0].clientX - rect.left) / rect.width * gridSize;
                const tapY = (e.changedTouches[0].clientY - rect.top) / rect.height * gridSize;
                
                const gridTapX = Math.floor(tapX);
                const gridTapY = Math.floor(tapY);
                
                if (gridTapX === player.x + 1 && gridTapY === player.y) movePlayer(1, 0);
                else if (gridTapX === player.x - 1 && gridTapY === player.y) movePlayer(-1, 0);
                else if (gridTapX === player.x && gridTapY === player.y + 1) movePlayer(0, 1);
                else if (gridTapX === player.x && gridTapY === player.y - 1) movePlayer(0, -1);
            }
        }, {passive: true});

        canvas.addEventListener('click', (e) => {
            if(!document.getElementById('game-screen').classList.contains('active')) return;
            
            const rect = canvas.getBoundingClientRect();
            const tapX = (e.clientX - rect.left) / rect.width * gridSize;
            const tapY = (e.clientY - rect.top) / rect.height * gridSize;
            
            const gridTapX = Math.floor(tapX);
            const gridTapY = Math.floor(tapY);
            
            if (gridTapX === player.x + 1 && gridTapY === player.y) movePlayer(1, 0);
            else if (gridTapX === player.x - 1 && gridTapY === player.y) movePlayer(-1, 0);
            else if (gridTapX === player.x && gridTapY === player.y + 1) movePlayer(0, 1);
            else if (gridTapX === player.x && gridTapY === player.y - 1) movePlayer(0, -1);
        });

        window.addEventListener('resize', () => {
            if(document.getElementById('game-screen').classList.contains('active')) {
                const container = document.getElementById('game-container');
                const rect = container.getBoundingClientRect();
                canvas.width = rect.width * 2;
                canvas.height = rect.height * 2;
                cellSize = canvas.width / gridSize;
            }
        });

        renderPickers();
    </script>
</body>
</html>
