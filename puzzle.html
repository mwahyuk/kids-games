<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teka-teki Hewan! 🧩</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #ffeaa7;
            --bg-end: #fab1a0;
            --primary: #ff7675;
            --secondary: #e17055;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #d63031;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        h2 {
            font-size: clamp(22px, 3.8vw, 32px);
            color: #e17055;
            margin: 8px 0 12px;
            text-shadow: 1px 1px 0 #fff;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 18px);
            max-width: 700px;
            margin-bottom: 20px;
        }

        .picker-card {
            width: clamp(75px, 16vw, 105px);
            height: clamp(75px, 16vw, 105px);
            background: white;
            border: 4px solid #ff7675;
            border-radius: 24px;
            font-size: clamp(40px, 8.5vw, 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 5px;
        }

        .picker-card span {
            font-size: clamp(12px, 2.2vw, 15px);
            font-weight: bold;
            color: #2d3436;
            margin-top: 2px;
        }

        .picker-card:hover { transform: scale(1.08); }

        .picker-card.selected {
            background: #ffe082;
            border-color: #d63031;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(214, 48, 49, 0.4);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s, box-shadow 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--secondary);
        }

        .btn.btn-primary {
            background: #ff7675;
            color: white;
            border-color: #d63031;
            box-shadow: 0 6px 0 #b2bec3;
        }
        .btn.btn-primary:active { box-shadow: 0 0 0 #b2bec3; }

        #puzzle-container {
            position: relative;
            width: clamp(280px, 78vmin, 620px);
            height: clamp(280px, 78vmin, 620px);
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 12px;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            touch-action: none;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .celeb-text {
            font-size: clamp(50px, 10vw, 75px);
            color: #d63031;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 white;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Teka-teki Hewan! 🧩</h1>

            <h2>1. Pilih Karakter Gambar:</h2>
            <div class="picker-grid" id="puzzle-grid"></div>

            <h2>2. Pilih Potongan:</h2>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
                <button class="btn" onclick="startPuzzle(2)">⭐ 2 x 2 Potongan</button>
                <button class="btn" onclick="startPuzzle(3)">⭐⭐ 3 x 3 Potongan</button>
            </div>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="puzzle-container">
                <canvas id="puzzle-canvas"></canvas>
            </div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <div class="celeb-text">Hebat Sekali! 🎉</div>
            <div style="font-size: 80px; margin: 15px 0;" id="celeb-emoji">🐱</div>
            <button class="btn btn-primary" onclick="showScreen('start-screen')">Main Lagi!</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const puzzleList = [
            { id: 'cat', emoji: '🐱', name: 'Kucing', color: '#ff7675' },
            { id: 'dino', emoji: '🦖', name: 'Dino', color: '#55efc4' },
            { id: 'dog', emoji: '🐶', name: 'Anjing', color: '#ffeaa7' },
            { id: 'rabbit', emoji: '🐰', name: 'Kelinci', color: '#74b9ff' },
            { id: 'panda', emoji: '🐼', name: 'Panda', color: '#a29bfe' },
            { id: 'lion', emoji: '🦁', name: 'Singa', color: '#fdcb6e' }
        ];

        let selectedPuzzle = puzzleList[0];

        function renderPuzzlePicker() {
            const grid = document.getElementById('puzzle-grid');
            grid.innerHTML = '';
            puzzleList.forEach(p => {
                const card = document.createElement('div');
                card.className = `picker-card ${p.id === selectedPuzzle.id ? 'selected' : ''}`;
                card.innerHTML = `${p.emoji}<span>${p.name}</span>`;
                card.onclick = () => {
                    playAudioTone(600, 0.1);
                    selectedPuzzle = p;
                    renderPuzzlePicker();
                };
                grid.appendChild(card);
            });
        }

        // Audio
        function playAudioTone(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        const canvas = document.getElementById('puzzle-canvas');
        const ctx = canvas.getContext('2d');
        let pieces = [];
        let gridSize = 2;
        let activePiece = null;
        let dragOffset = { x: 0, y: 0 };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startPuzzle(size) {
            gridSize = size;
            showScreen('game-screen');
            initCanvas();
        }

        function initCanvas() {
            const container = document.getElementById('puzzle-container');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;

            const pw = canvas.width / gridSize;
            const ph = canvas.height / gridSize;

            pieces = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const targetX = c * pw;
                    const targetY = r * ph;
                    const randomX = Math.random() * (canvas.width - pw);
                    const randomY = Math.random() * (canvas.height - ph);
                    
                    pieces.push({
                        id: r * gridSize + c,
                        targetX, targetY,
                        currentX: randomX,
                        currentY: randomY,
                        width: pw, height: ph,
                        isSnapped: false
                    });
                }
            }

            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background ghost container
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid outline targets
            const pw = canvas.width / gridSize;
            const ph = canvas.height / gridSize;
            ctx.strokeStyle = '#dcdde1';
            ctx.lineWidth = 4;
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    ctx.strokeRect(c * pw, r * ph, pw, ph);
                }
            }

            // Draw Pieces
            pieces.forEach(p => {
                ctx.save();
                ctx.translate(p.currentX, p.currentY);
                
                // Card background
                ctx.fillStyle = selectedPuzzle.color;
                ctx.fillRect(0, 0, p.width, p.height);
                ctx.strokeStyle = '#2d3436';
                ctx.lineWidth = 6;
                ctx.strokeRect(0, 0, p.width, p.height);

                // Draw Emoji Artwork
                ctx.font = `${p.width * 0.5}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(selectedPuzzle.emoji, p.width / 2, p.height / 2);

                ctx.restore();
            });
        }

        // Pointer Events for Dragging
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;

            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (!p.isSnapped && x >= p.currentX && x <= p.currentX + p.width && y >= p.currentY && y <= p.currentY + p.height) {
                    activePiece = p;
                    dragOffset.x = x - p.currentX;
                    dragOffset.y = y - p.currentY;
                    playAudioTone(500, 0.08);
                    // Move to top
                    pieces.splice(i, 1);
                    pieces.push(p);
                    break;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!activePiece) return;
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;

            activePiece.currentX = x - dragOffset.x;
            activePiece.currentY = y - dragOffset.y;
            render();
        });

        canvas.addEventListener('pointerup', () => {
            if (!activePiece) return;
            
            const dist = Math.hypot(activePiece.currentX - activePiece.targetX, activePiece.currentY - activePiece.targetY);
            if (dist < 60) {
                activePiece.currentX = activePiece.targetX;
                activePiece.currentY = activePiece.targetY;
                activePiece.isSnapped = true;
                playAudioTone(800, 0.15);
            } else {
                playAudioTone(300, 0.1);
            }
            activePiece = null;
            render();

            if (pieces.every(p => p.isSnapped)) {
                setTimeout(() => {
                    playAudioTone(1000, 0.4);
                    document.getElementById('celeb-emoji').innerText = selectedPuzzle.emoji;
                    showScreen('celeb-screen');
                }, 400);
            }
        });

        renderPuzzlePicker();
    </script>
</body>
</html>
