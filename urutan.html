<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menyusun Balok! 📊</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #333;
        }

        #home-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            font-size: 32px;
            text-decoration: none;
            z-index: 99999;
            background: white;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        #home-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            z-index: 10;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(34px, 6.5vw, 56px);
            color: white;
            text-shadow: 3px 3px 0 #0056b3, -2px -2px 0 #0056b3, 2px -2px 0 #0056b3, -2px 2px 0 #0056b3;
            text-align: center;
            margin-bottom: 25px;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        /* Mode Selection Cards */
        .mode-cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 380px;
            align-items: center;
        }

        .mode-card {
            background: white;
            border: 4px solid #fdcb6e;
            border-radius: 26px;
            padding: 16px 32px;
            font-size: clamp(24px, 5vw, 34px);
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 0 #d4af37, 0 12px 20px rgba(0,0,0,0.15);
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #2d3436;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .mode-card:hover {
            transform: scale(1.05);
        }

        .mode-card:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #d4af37;
        }

        /* Game Board Container */
        #game-board-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 32px;
            padding: 30px 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(12px, 3vw, 24px);
            flex-wrap: wrap;
            width: 100%;
            min-height: 120px;
        }

        .draggable {
            width: clamp(75px, 15vw, 105px);
            height: clamp(75px, 15vw, 105px);
            background: white;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(36px, 8vw, 54px);
            font-weight: bold;
            box-shadow: 0 8px 0 #b2bec3, 0 12px 20px rgba(0,0,0,0.15);
            cursor: grab;
            position: absolute;
            z-index: 100;
            transition: transform 0.1s;
            border: 4px solid #00cec9;
            touch-action: none;
            color: #2d3436;
        }
        
        .draggable.dragging {
            box-shadow: 0 16px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: grabbing;
            pointer-events: none;
            transform: scale(1.1);
        }

        .slot {
            width: clamp(85px, 16vw, 115px);
            height: clamp(85px, 16vw, 115px);
            border: 4px dashed #6c5ce7;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(108, 92, 231, 0.1);
        }

        .slot::before {
            content: attr(data-index);
            position: absolute;
            bottom: -34px;
            font-size: clamp(18px, 3.5vw, 24px);
            color: #6c5ce7;
            font-weight: bold;
            text-shadow: 1px 1px 0 #fff;
        }

        .slot.filled {
            border: 4px solid #00b894;
            background: rgba(0, 184, 148, 0.15);
        }

        .locked {
            pointer-events: none !important;
            box-shadow: 0 3px 0 #b2bec3 !important;
            transform: translate(0, 0) !important;
            margin: 0;
            position: static !important;
        }

        #items-source {
            position: relative;
            height: 120px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        .star-celebration {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 30px 40px;
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 2000;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: clamp(280px, 80vw, 400px);
        }

        .star-celebration.show { transform: translate(-50%, -50%) scale(1); }

        .star-celebration h2 {
            font-size: clamp(28px, 6vw, 40px);
            color: #ffaa00;
            margin: 0 0 15px 0;
        }
        
        .stars {
            font-size: clamp(40px, 8vw, 60px);
            margin-bottom: 15px;
        }

        #round-indicator {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            font-size: clamp(20px, 4vw, 28px);
            color: white;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <a href="index.html" id="home-btn" onclick="window.location.href='index.html'; return true;">🏠</a>
    <canvas id="confetti-canvas"></canvas>

    <div class="star-celebration" id="star-celebration">
        <h2>Luar Biasa! 🎉</h2>
        <div class="stars">⭐⭐⭐⭐⭐</div>
        <button class="mode-card" style="margin: 0 auto; width: 80%;" onclick="nextRoundAfterStar()">Lanjut Main!</button>
    </div>

    <!-- 1. Home Screen -->
    <div id="home-screen" class="screen active">
        <h1>Menyusun Balok! 📊</h1>
        <div class="mode-cards-container">
            <div class="mode-card" onclick="startGame('number')">🔢 Balok Angka</div>
            <div class="mode-card" onclick="startGame('size')">📏 Ukuran Balok</div>
            <div class="mode-card" onclick="startGame('alphabet')">🔤 Balok Alfabet</div>
        </div>
    </div>

    <!-- 2. Game Screen -->
    <div id="game-screen" class="screen">
        <div id="round-indicator">Ronde: <span id="round-text">1</span></div>
        <div id="game-board-card">
            <h2 style="margin: 0; color: #6c5ce7; font-size: clamp(22px, 4vw, 32px);">Geser & Susun Dari Terkecil ke Terbesar!</h2>
            <div id="items-source" class="container"></div>
            <div id="slots-target" class="container"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'ding') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'yeay') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch(e) {}
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnConfetti() {
            particles = [];
            confettiActive = true;
            const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            if (!confettiActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeCount = 0;
            
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.rot += p.rotSpeed;
                
                if (p.y < canvas.height) activeCount++;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
            });

            if (activeCount > 0) {
                requestAnimationFrame(updateConfetti);
            } else {
                confettiActive = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Game Logic
        let currentMode = '';
        let roundsCompleted = 0;
        let itemsCount = 3;
        let currentSequence = [];
        let correctlyPlaced = 0;

        const borderColors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF8C42', '#9D4EDD'];
        const sizeEmojis = ['🍎', '⚽', '🚗', '⭐', '🎈'];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame(mode) {
            initAudio();
            currentMode = mode;
            roundsCompleted = 0;
            itemsCount = 3;
            document.getElementById('round-text').innerText = roundsCompleted + 1;
            showScreen('game-screen');
            startRound();
        }

        function getSequence(count) {
            let seq = [];
            if (currentMode === 'number') {
                let start = Math.floor(Math.random() * 10) + 1;
                for (let i = 0; i < count; i++) {
                    seq.push({ val: start + i, display: start + i, color: borderColors[i % borderColors.length] });
                }
            } else if (currentMode === 'alphabet') {
                let start = Math.floor(Math.random() * 21);
                for (let i = 0; i < count; i++) {
                    let char = String.fromCharCode(65 + start + i);
                    seq.push({ val: i, display: char, color: borderColors[i % borderColors.length] });
                }
            } else if (currentMode === 'size') {
                let emoji = sizeEmojis[Math.floor(Math.random() * sizeEmojis.length)];
                let baseSize = 20;
                let step = 12;
                for (let i = 0; i < count; i++) {
                    seq.push({ 
                        val: i, 
                        display: emoji, 
                        fontSize: `${baseSize + (i * step)}px`,
                        color: borderColors[i % borderColors.length] 
                    });
                }
            }
            return seq;
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startRound() {
            correctlyPlaced = 0;
            const source = document.getElementById('items-source');
            const target = document.getElementById('slots-target');
            source.innerHTML = '';
            target.innerHTML = '';

            if (roundsCompleted >= 10) itemsCount = 5;
            else if (roundsCompleted >= 5) itemsCount = 4;
            else itemsCount = 3;

            document.getElementById('round-text').innerText = roundsCompleted + 1;

            currentSequence = getSequence(itemsCount);
            
            for (let i = 0; i < itemsCount; i++) {
                let slot = document.createElement('div');
                slot.className = 'slot';
                slot.setAttribute('data-index', `ke-${i+1}`);
                slot.setAttribute('data-val', currentSequence[i].val);
                target.appendChild(slot);
            }

            let shuffled = shuffle([...currentSequence]);
            
            let boardContainer = document.getElementById('game-board-card');
            let sourceWidth = Math.min(boardContainer.getBoundingClientRect().width - 40, 750);
            let itemSpace = sourceWidth / itemsCount;

            shuffled.forEach((item, index) => {
                let el = document.createElement('div');
                el.className = 'draggable';
                el.innerHTML = item.display;
                if (item.fontSize) el.style.fontSize = item.fontSize;
                el.style.border = `4px solid ${item.color}`;
                el.setAttribute('data-val', item.val);
                
                let leftPos = (index * itemSpace) + (itemSpace/2) - 40;
                el.style.left = leftPos + 'px';
                el.style.top = '10px';
                el.setAttribute('data-orig-left', leftPos);
                el.setAttribute('data-orig-top', '10px');

                setupDrag(el);
                source.appendChild(el);
            });
        }

        // Drag & Drop with Center Distance Matching
        let activeEl = null;
        let startX, startY;
        let initialX, initialY;

        function setupDrag(el) {
            el.addEventListener('mousedown', dragStart);
            el.addEventListener('touchstart', dragStart, {passive: false});
        }

        function dragStart(e) {
            if (e.target.classList.contains('locked')) return;
            e.preventDefault();
            activeEl = e.target;
            activeEl.classList.add('dragging');

            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            const rect = activeEl.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            
            activeEl.style.position = 'fixed';
            activeEl.style.left = initialX + 'px';
            activeEl.style.top = initialY + 'px';
            activeEl.style.margin = '0';
            document.body.appendChild(activeEl);

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function drag(e) {
            if (!activeEl) return;
            e.preventDefault();
            
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = clientX - startX;
            let dy = clientY - startY;

            activeEl.style.left = (initialX + dx) + 'px';
            activeEl.style.top = (initialY + dy) + 'px';
        }

        function dragEnd(e) {
            if (!activeEl) return;
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);

            activeEl.classList.remove('dragging');

            const rect = activeEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const slots = document.querySelectorAll('.slot:not(.filled)');
            let matched = false;

            for (let slot of slots) {
                const sRect = slot.getBoundingClientRect();
                const sCenterX = sRect.left + sRect.width / 2;
                const sCenterY = sRect.top + sRect.height / 2;
                
                const dist = Math.hypot(centerX - sCenterX, centerY - sCenterY);
                
                if (dist < 70) {
                    if (slot.getAttribute('data-val') === activeEl.getAttribute('data-val')) {
                        matched = true;
                        playSound('ding');
                        
                        slot.appendChild(activeEl);
                        activeEl.style.position = 'static';
                        activeEl.style.left = 'auto';
                        activeEl.style.top = 'auto';
                        
                        activeEl.classList.add('locked');
                        slot.classList.add('filled');
                        
                        correctlyPlaced++;
                        checkWin();
                    }
                }
            }

            if (!matched) {
                playSound('pop');
                const source = document.getElementById('items-source');
                source.appendChild(activeEl);
                activeEl.style.position = 'absolute';
                activeEl.style.left = activeEl.getAttribute('data-orig-left') + 'px';
                activeEl.style.top = activeEl.getAttribute('data-orig-top');
            }

            activeEl = null;
        }

        function checkWin() {
            if (correctlyPlaced === itemsCount) {
                playSound('yeay');
                spawnConfetti();
                roundsCompleted++;
                
                setTimeout(() => {
                    if (roundsCompleted % 5 === 0) {
                        document.getElementById('star-celebration').classList.add('show');
                    } else {
                        startRound();
                    }
                }, 2000);
            }
        }

        function nextRoundAfterStar() {
            document.getElementById('star-celebration').classList.remove('show');
            startRound();
        }
    </script>
</body>
</html>
