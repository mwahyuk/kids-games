<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#3ab0ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Kumpulan game edukasi seru untuk anak usia 4-6 tahun. Bermain sambil belajar!">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>Kiddo Games 🎮 — Ayo Bermain & Belajar!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;900&family=Nunito:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(180deg, #bfe3ff 0%, #eef7ff 100%);
            color: #2c3e50;
            min-height: 100vh;
            padding: 16px 16px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND DECORATIONS ===== */
        .sky-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            width: 100px;
            height: 30px;
            animation: float-cloud 30s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .cloud::before { width: 40px; height: 40px; top: -15px; left: 15px; }
        .cloud::after { width: 50px; height: 50px; top: -20px; left: 40px; }

        .c1 { top: 10%; left: -100px; animation-duration: 40s; }
        .c2 { top: 25%; left: -100px; animation-duration: 25s; animation-delay: 10s; }
        .c3 { top: 40%; left: -100px; animation-duration: 35s; animation-delay: 5s; }

        @keyframes float-cloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 120px)); }
        }

        /* ===== HEADER / TOP CONTROL BAR ===== */
        .header {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .profile-pill {
            background: white;
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 2px solid #fff;
        }

        .profile-avatar {
            font-size: 1.4rem;
        }

        .profile-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .mute-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .mute-btn:active {
            transform: scale(0.9);
        }

        /* ===== MENU TITLE ===== */
        .title-container {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #2f3640;
            letter-spacing: -1px;
            text-shadow: 2px 2px 0 white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #7f8c8d;
            margin-top: 4px;
        }

        /* ===== CATEGORY NAV ===== */
        .category-nav {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            z-index: 10;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: white;
            border: 2px solid white;
            border-radius: 20px;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.8rem;
            color: #7f8c8d;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        /* ===== MAIN GAMES GRID ===== */
        .games-container {
            width: 100%;
            max-width: 650px;
            z-index: 10;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 500px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        .game-card {
            background: white;
            border-radius: 28px;
            border: 3.5px solid #2f3542;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 8px 0 #2f3542;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .game-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2f3542;
        }

        .game-art-box {
            width: 100%;
            aspect-ratio: 1.1;
            border-radius: 20px;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2f3542;
        }

        /* Large emoji graphics */
        .game-emoji {
            font-size: 3.2rem;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.1));
            transition: transform 0.2s;
        }

        .game-card:active .game-emoji {
            transform: scale(1.1) rotate(5deg);
        }

        .game-play-overlay {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2ecc71;
            border: 2px solid #2f3542;
            bottom: 6px;
            right: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 #2f3542;
        }

        .play-arrow {
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid white;
            margin-left: 2px;
        }

        .game-label {
            font-size: 0.85rem;
            font-weight: 900;
            color: #2f3542;
            text-align: center;
            line-height: 1.25;
        }

        .card-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #fdcb6e;
            color: #2f3542;
            border: 2px solid #2f3542;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 900;
            padding: 2px 8px;
            box-shadow: 0 2px 0 #2f3542;
            transform: rotate(6deg);
        }

        /* Card theme backgrounds */
        .gc-1 { background: #bde0fe; }
        .gc-2 { background: #d8f3dc; }
        .gc-3 { background: #fcf6bd; }
        .gc-4 { background: #ffe5d9; }
        .gc-5 { background: #e0c3fc; }
        .gc-6 { background: #ffc8dd; }
        .gc-7 { background: #ffadad; }
        .gc-8 { background: #b8f3d4; }
        .gc-9 { background: #c9f5d1; }

        /* ===== FLOATING INSTALL PWA BUTTON ===== */
        .floating-install-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: 3.5px solid #2f3542;
            box-shadow: 0 8px 0 #2f3542;
            cursor: pointer;
            z-index: 999;
            display: none; /* Controlled by JS beforeinstallprompt */
            align-items: center;
            justify-content: center;
            animation: breathe-btn 2.5s ease-in-out infinite;
            transition: transform 0.1s;
        }

        .floating-install-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2f3542;
        }

        .install-controller-icon {
            font-size: 2rem;
            position: relative;
        }

        .install-arrow-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #fdcb6e;
            border: 2px solid #2f3542;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        @keyframes breathe-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ===== FOOTER INFO ===== */
        .footer-credit {
            margin-top: 30px;
            text-align: center;
            font-size: 0.75rem;
            color: #7f8c8d;
            font-weight: 700;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Sky Clouds -->
    <div class="sky-elements">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
    </div>

    <!-- Header bar -->
    <div class="header">
        <div class="profile-pill">
            <span class="profile-avatar">👦</span>
            <span class="profile-name">Hi, Kiddo!</span>
        </div>
        <button class="mute-btn" id="muteBtn">🔊</button>
    </div>

    <!-- Title menu -->
    <div class="title-container">
        <h1 class="main-title">Ayo Main! 🎮</h1>
        <p class="sub-title">Pilih game favoritmu di bawah ini</p>
    </div>

    <!-- Category Quick Filters -->
    <div class="category-nav">
        <button class="cat-chip active" data-filter="all">🌟 Semua</button>
        <button class="cat-chip" data-filter="angka">🔢 Angka</button>
        <button class="cat-chip" data-filter="bentuk">🔷 Bentuk</button>
        <button class="cat-chip" data-filter="puzzle">🧩 Puzzle</button>
        <button class="cat-chip" data-filter="kreatif">🎨 Kreatif</button>
    </div>

    <!-- Games Container Grid -->
    <div class="games-container">
        <div class="games-grid">
            
            <a href="berhitung.html" class="game-card" data-category="angka">
                <div class="game-art-box gc-1">
                    <span class="game-emoji">🔢</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Menghitung Jari</span>
            </a>

            <a href="bentuk.html" class="game-card" data-category="bentuk">
                <div class="game-art-box gc-2">
                    <span class="game-emoji">🔷</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Mencocokkan Bentuk</span>
            </a>

            <a href="memory.html" class="game-card" data-category="puzzle">
                <div class="game-art-box gc-3">
                    <span class="game-emoji">🐾</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Mengingat Teman</span>
            </a>

            <a href="puzzle.html" class="game-card" data-category="puzzle">
                <div class="game-art-box gc-4">
                    <span class="game-emoji">🧩</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Teka-teki Hewan</span>
                <span class="card-badge">BARU</span>
            </a>

            <a href="suara.html" class="game-card" data-category="puzzle">
                <div class="game-art-box gc-5">
                    <span class="game-emoji">🔊</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Siapa Suaranya?</span>
                <span class="card-badge">BARU</span>
            </a>

            <a href="balon.html" class="game-card" data-category="angka">
                <div class="game-art-box gc-6">
                    <span class="game-emoji">🎈</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Menjatuhkan Balon</span>
                <span class="card-badge">BARU</span>
            </a>

            <a href="mewarnai.html" class="game-card" data-category="kreatif">
                <div class="game-art-box gc-7">
                    <span class="game-emoji">🎨</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Ayo Melukis</span>
            </a>

            <a href="urutan.html" class="game-card" data-category="angka">
                <div class="game-art-box gc-8">
                    <span class="game-emoji">📊</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Menyusun Balok</span>
            </a>

            <a href="labirin.html" class="game-card" data-category="puzzle">
                <div class="game-art-box gc-9">
                    <span class="game-emoji">🌟</span>
                    <div class="game-play-overlay"><div class="play-arrow"></div></div>
                </div>
                <span class="game-label">Mari Berbagi</span>
                <span class="card-badge">BARU</span>
            </a>

        </div>
    </div>

    <!-- PWA Floating Controller Install Button -->
    <button class="floating-install-btn" id="floatingInstallBtn" title="Install App ke Tablet">
        <span class="install-controller-icon">🎮</span>
        <span class="install-arrow-badge">📥</span>
    </button>

    <div class="footer-credit">
        Made with ❤️ untuk anak-anak Indonesia 😊
    </div>

    <script>
        // ===== Audio System =====
        let audioMuted = false;

        function playSound(type) {
            if (audioMuted) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(850, now + 0.07);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.07);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {}
        }

        // Mute Button
        const muteBtn = document.getElementById('muteBtn');
        muteBtn.addEventListener('click', () => {
            audioMuted = !audioMuted;
            muteBtn.textContent = audioMuted ? '🔇' : '🔊';
        });

        // Filter functionality
        const chips = document.querySelectorAll('.cat-chip');
        const cards = document.querySelectorAll('.game-card');

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                playSound('tap');
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');

                const filter = chip.getAttribute('data-filter');

                cards.forEach(card => {
                    const cat = card.getAttribute('data-category');
                    if (filter === 'all' || cat === filter) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // Card sounds
        cards.forEach(card => {
            card.addEventListener('click', () => playSound('click'));
        });

        // ===== PWA Install =====
        let deferredPrompt;
        const floatingInstallBtn = document.getElementById('floatingInstallBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            floatingInstallBtn.style.display = 'flex';
        });

        floatingInstallBtn.addEventListener('click', () => {
            playSound('click');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    floatingInstallBtn.style.display = 'none';
                });
            }
        });

        window.addEventListener('appinstalled', () => {
            floatingInstallBtn.style.display = 'none';
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
