<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <title>Ayo Mewarnai! 🎨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            touch-action: none;
        }
        
        #home-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        #home-btn:active {
            transform: scale(0.9);
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        h1 {
            color: #ff6b6b;
            font-size: clamp(32px, 6vw, 48px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15), -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            margin: max(15px, env(safe-area-inset-top)) 0 10px;
            z-index: 10;
        }

        #main-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 95vw;
            max-height: calc(100vh - 140px);
            display: none;
        }

        #canvas-container {
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 6px solid #fff;
            transition: transform 0.3s ease;
        }

        .alive-butterfly { animation: flap 0.5s infinite alternate ease-in-out; }
        .alive-flower { animation: sway 2s infinite alternate ease-in-out; }
        .alive-fish { animation: swim 1s infinite alternate ease-in-out; }
        .alive-car { animation: bounce 0.5s infinite alternate ease-in-out; }
        .alive-dinosaur { animation: roar 1s infinite alternate ease-in-out; }

        @keyframes flap { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.9); } }
        @keyframes sway { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
        @keyframes swim { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
        @keyframes bounce { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
        @keyframes roar { 0% { transform: rotate(-3deg) scale(1); } 100% { transform: rotate(3deg) scale(1.05); } }

        canvas {
            display: block;
            border-radius: 12px;
            touch-action: none;
            cursor: crosshair;
            max-width: 85vw;
            max-height: 60vh;
            object-fit: contain;
        }

        #palette {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 35px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .color-btn {
            width: clamp(45px, 8vw, 60px);
            height: clamp(45px, 8vw, 60px);
            border-radius: 50%;
            border: 3.5px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-btn.active {
            transform: scale(1.25);
            border: 4px solid #fff;
            box-shadow: 0 0 0 4px #ffeb3b, 0 6px 12px rgba(0,0,0,0.3);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 4px #ffeb3b, 0 6px 12px rgba(0,0,0,0.3); }
            100% { box-shadow: 0 0 0 6px #ff9800, 0 8px 16px rgba(0,0,0,0.4); }
        }

        #controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .action-btn {
            font-family: 'Bubblegum Sans', cursive;
            font-size: clamp(20px, 4vw, 28px);
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #333;
            box-shadow: 0 5px 0 #ccc, 0 8px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #ccc;
        }

        .icon-btn {
            font-size: clamp(24px, 5vw, 32px);
            padding: 8px 16px;
        }

        #next-btn {
            background: #4CAF50;
            color: white;
            box-shadow: 0 5px 0 #388E3C, 0 8px 10px rgba(0,0,0,0.15);
        }
        
        #next-btn:active {
            box-shadow: 0 0 0 #388E3C;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* Selection Screen */
        #selection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            background: inherit;
            z-index: 20;
        }

        .thumbnail-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 850px;
            padding: 20px;
        }

        .thumbnail-btn {
            background: white;
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            padding: 8px;
        }

        .thumbnail-btn:active {
            transform: scale(0.95);
        }

        /* Responsive Layout Switch for Portrait Tablet & Mobile */
        @media (max-width: 768px), (orientation: portrait) {
            #main-area {
                flex-direction: column-reverse;
                gap: 10px;
            }
            #palette {
                grid-template-columns: repeat(6, 1fr);
                gap: 8px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" id="home-btn" aria-label="Home" onclick="window.location.href='index.html'; return true;">🏠</a>
    <canvas id="confetti-canvas"></canvas>
    
    <div id="game-container">
        <h1>Ayo Mewarnai! 🎨</h1>
        
        <div id="selection-screen">
            <h2>Pilih Gambar!</h2>
            <div class="thumbnail-grid" id="thumbnail-grid"></div>
        </div>

        <div id="main-area">
            <div id="palette"></div>
            
            <div id="canvas-container">
                <canvas id="drawing-canvas" width="500" height="400"></canvas>
            </div>
        </div>
        
        <div id="controls" style="display: none;">
            <button class="action-btn icon-btn" id="clear-btn" aria-label="Reset" title="Hapus">🧹</button>
            <button class="action-btn icon-btn" id="download-btn" aria-label="Simpan" title="Simpan">💾</button>
            <button class="action-btn" id="next-btn">Gambar Baru 🎨</button>
        </div>
    </div>

    <script>
        const colors = [
            '#FF3B30', '#FF9500', '#FFCC00', '#4CD964',
            '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55',
            '#8B4513', '#333333', '#FFFFFF', '#999999'
        ];
        
        const drawings = ['butterfly', 'flower', 'fish', 'car', 'dinosaur'];
        let currentDrawingIndex = 0;
        let selectedColor = hexToRgb(colors[0]);
        let isCompleted = false;

        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasContainer = document.getElementById('canvas-container');
        const paletteContainer = document.getElementById('palette');
        const clearBtn = document.getElementById('clear-btn');
        const downloadBtn = document.getElementById('download-btn');
        const nextBtn = document.getElementById('next-btn');
        const mainArea = document.getElementById('main-area');
        const controls = document.getElementById('controls');
        const selectionScreen = document.getElementById('selection-screen');
        const thumbnailGrid = document.getElementById('thumbnail-grid');

        // Setup Palette
        colors.forEach((c, index) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = c;
            if (index === 0) btn.classList.add('active');
            
            btn.addEventListener('click', (e) => {
                selectedColor = hexToRgb(c);
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playSound('select');
            });
            paletteContainer.appendChild(btn);
        });

        // Audio System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                
                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'ting') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'applause') {
                    for (let i = 0; i < 3; i++) {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.type = 'triangle';
                        osc2.frequency.setValueAtTime(400 + (i * 200), now);
                        osc2.frequency.linearRampToValueAtTime(600 + (i * 200), now + 0.5);
                        gain2.gain.setValueAtTime(0, now);
                        gain2.gain.linearRampToValueAtTime(0.2, now + 0.2);
                        gain2.gain.linearRampToValueAtTime(0, now + 1.5);
                        osc2.start(now);
                        osc2.stop(now + 1.5);
                    }
                }
            } catch(e) {}
        }

        // Drawings
        function drawButterfly(c) {
            c.lineWidth = 6; c.strokeStyle = '#000000'; c.lineJoin = 'round'; c.lineCap = 'round'; c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(250, 180); c.bezierCurveTo(150, 50, 50, 100, 100, 200); c.bezierCurveTo(120, 250, 200, 220, 250, 240); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(250, 180); c.bezierCurveTo(350, 50, 450, 100, 400, 200); c.bezierCurveTo(380, 250, 300, 220, 250, 240); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(250, 240); c.bezierCurveTo(150, 260, 100, 320, 150, 370); c.bezierCurveTo(200, 400, 230, 300, 250, 320); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(250, 240); c.bezierCurveTo(350, 260, 400, 320, 350, 370); c.bezierCurveTo(300, 400, 270, 300, 250, 320); c.fill(); c.stroke();
            c.beginPath(); c.ellipse(250, 250, 15, 70, 0, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(250, 160, 20, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(240, 145); c.quadraticCurveTo(220, 100, 200, 110); c.moveTo(260, 145); c.quadraticCurveTo(280, 100, 300, 110); c.stroke();
        }

        function drawFlower(c) {
            c.lineWidth = 6; c.strokeStyle = '#000000'; c.lineJoin = 'round'; c.lineCap = 'round'; c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(240, 250); c.quadraticCurveTo(250, 320, 240, 380); c.lineTo(260, 380); c.quadraticCurveTo(270, 320, 260, 250); c.closePath(); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(245, 320); c.quadraticCurveTo(150, 300, 160, 360); c.quadraticCurveTo(200, 360, 248, 340); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(255, 300); c.quadraticCurveTo(350, 280, 340, 340); c.quadraticCurveTo(300, 340, 252, 320); c.fill(); c.stroke();
            const numPetals = 8;
            for (let i = 0; i < numPetals; i++) {
                const angle = (i / numPetals) * Math.PI * 2;
                const x = 250 + Math.cos(angle) * 70;
                const y = 150 + Math.sin(angle) * 70;
                c.beginPath(); c.arc(x, y, 40, 0, Math.PI * 2); c.fill(); c.stroke();
            }
            c.beginPath(); c.arc(250, 150, 50, 0, Math.PI * 2); c.fill(); c.stroke();
        }

        function drawFish(c) {
            c.lineWidth = 6; c.strokeStyle = '#000000'; c.lineJoin = 'round'; c.lineCap = 'round'; c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(350, 200); c.lineTo(450, 120); c.lineTo(420, 200); c.lineTo(450, 280); c.closePath(); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(200, 160); c.quadraticCurveTo(250, 80, 300, 170); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(200, 240); c.quadraticCurveTo(250, 320, 300, 230); c.fill(); c.stroke();
            c.beginPath(); c.ellipse(220, 200, 140, 90, 0, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(340, 155); c.quadraticCurveTo(360, 200, 340, 245); c.stroke();
            c.beginPath(); c.arc(140, 170, 15, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(135, 170, 5, 0, Math.PI * 2); c.fillStyle = '#000'; c.fill(); c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(100, 210); c.quadraticCurveTo(130, 240, 160, 210); c.stroke();
            c.beginPath(); c.arc(70, 120, 15, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(50, 70, 10, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(70, 30, 5, 0, Math.PI * 2); c.fill(); c.stroke();
        }

        function drawCar(c) {
            c.lineWidth = 6; c.strokeStyle = '#000000'; c.lineJoin = 'round'; c.lineCap = 'round'; c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(100, 250); c.lineTo(80, 200); c.quadraticCurveTo(80, 180, 100, 180); c.lineTo(150, 180);
            c.lineTo(200, 120); c.quadraticCurveTo(220, 100, 250, 100); c.lineTo(350, 100); c.quadraticCurveTo(380, 100, 400, 130);
            c.lineTo(430, 180); c.lineTo(440, 180); c.quadraticCurveTo(460, 180, 460, 200); c.lineTo(460, 250);
            c.quadraticCurveTo(460, 270, 440, 270); c.lineTo(100, 270); c.quadraticCurveTo(80, 270, 80, 250); c.closePath();
            c.fill(); c.stroke();
            c.beginPath(); c.moveTo(200, 120); c.lineTo(165, 180); c.lineTo(250, 180); c.lineTo(250, 120); c.closePath(); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(270, 120); c.lineTo(270, 180); c.lineTo(380, 180); c.lineTo(350, 120); c.closePath(); c.fill(); c.stroke();
            c.beginPath(); c.arc(150, 270, 35, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(150, 270, 12, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(380, 270, 35, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(380, 270, 12, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.arc(450, 220, 10, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(260, 180); c.lineTo(260, 270); c.stroke();
            c.beginPath(); c.moveTo(280, 200); c.lineTo(310, 200); c.stroke();
        }

        function drawDinosaur(c) {
            c.lineWidth = 6; c.strokeStyle = '#000000'; c.lineJoin = 'round'; c.lineCap = 'round'; c.fillStyle = '#FFFFFF';
            c.beginPath(); c.moveTo(300, 100); c.lineTo(350, 100); c.quadraticCurveTo(380, 100, 380, 130); c.lineTo(380, 150);
            c.lineTo(330, 150); c.lineTo(330, 170); c.lineTo(380, 170); c.quadraticCurveTo(390, 170, 390, 190); c.lineTo(380, 220);
            c.quadraticCurveTo(350, 250, 350, 280); c.quadraticCurveTo(350, 320, 250, 320); c.lineTo(150, 320); c.quadraticCurveTo(100, 320, 100, 280);
            c.quadraticCurveTo(150, 280, 180, 220); c.quadraticCurveTo(220, 150, 280, 150); c.lineTo(300, 100); c.closePath();
            c.fill(); c.stroke();
            c.beginPath(); c.moveTo(350, 270); c.quadraticCurveTo(330, 300, 250, 300); c.stroke();
            c.beginPath(); c.moveTo(250, 320); c.lineTo(250, 360); c.lineTo(280, 360); c.lineTo(280, 320); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(200, 320); c.lineTo(200, 360); c.lineTo(230, 360); c.lineTo(230, 320); c.fill(); c.stroke();
            c.beginPath(); c.moveTo(350, 230); c.lineTo(380, 250); c.lineTo(390, 240); c.stroke();
            c.beginPath(); c.moveTo(180, 220); c.lineTo(160, 190); c.lineTo(195, 205); c.lineTo(200, 170); c.lineTo(225, 185);
            c.lineTo(240, 150); c.lineTo(260, 170); c.lineTo(280, 140); c.lineTo(290, 155); c.stroke();
            c.beginPath(); c.arc(330, 120, 6, 0, Math.PI * 2); c.fillStyle = '#000'; c.fill(); c.stroke();
        }

        const drawingFns = [drawButterfly, drawFlower, drawFish, drawCar, drawDinosaur];

        function setupSelection() {
            thumbnailGrid.innerHTML = '';
            drawingFns.forEach((fn, index) => {
                const btn = document.createElement('div');
                btn.className = 'thumbnail-btn';
                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 150;
                thumbCanvas.height = 120;
                const tCtx = thumbCanvas.getContext('2d');
                tCtx.scale(0.3, 0.3);
                fn(tCtx);
                
                btn.appendChild(thumbCanvas);
                btn.addEventListener('click', () => {
                    playSound('select');
                    currentDrawingIndex = index;
                    showGameScreen();
                });
                thumbnailGrid.appendChild(btn);
            });
        }

        function showSelectionScreen() {
            selectionScreen.style.display = 'flex';
            mainArea.style.display = 'none';
            controls.style.display = 'none';
        }

        function showGameScreen() {
            selectionScreen.style.display = 'none';
            mainArea.style.display = 'flex';
            controls.style.display = 'flex';
            loadDrawing();
        }

        function loadDrawing() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawingFns[currentDrawingIndex](ctx);

            isCompleted = false;
            canvasContainer.className = '';
        }

        function checkCompletion() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            let whitePixels = 0;
            
            for (let i = 0; i < data.length; i += 400) {
                if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) whitePixels++;
            }
            
            if (whitePixels < 20 && !isCompleted) {
                isCompleted = true;
                triggerCompletion();
            }
        }

        function triggerCompletion() {
            playSound('applause');
            fireConfetti();
            const drawingType = drawings[currentDrawingIndex];
            canvasContainer.className = `alive-${drawingType}`;
        }

        function hexToRgb(hex) {
            if (hex === '#FFFFFF') return {r: 255, g: 255, b: 255, a: 255};
            const bigint = parseInt(hex.slice(1), 16);
            return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255, a: 255 };
        }

        function colorsMatch(data, pos, targetR, targetG, targetB, tolerance = 50) {
            return Math.abs(data[pos] - targetR) <= tolerance &&
                   Math.abs(data[pos+1] - targetG) <= tolerance &&
                   Math.abs(data[pos+2] - targetB) <= tolerance;
        }

        function floodFill(x, y, fillColor) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width, h = canvas.height;
            const pos = (y * w + x) * 4;
            
            const targetR = data[pos], targetG = data[pos + 1], targetB = data[pos + 2];
            
            if (targetR < 100 && targetG < 100 && targetB < 100) return; 
            if (Math.abs(targetR - fillColor.r) < 10 && Math.abs(targetG - fillColor.g) < 10 && Math.abs(targetB - fillColor.b) < 10) return;

            const pixelStack = [[x, y]];
            
            while (pixelStack.length > 0) {
                const newPos = pixelStack.pop();
                let currentX = newPos[0], currentY = newPos[1];
                let pixelPos = (currentY * w + currentX) * 4;
                
                while (currentY >= 0 && colorsMatch(data, pixelPos, targetR, targetG, targetB)) {
                    currentY--; pixelPos -= w * 4;
                }
                
                pixelPos += w * 4; currentY++;
                let reachLeft = false, reachRight = false;
                
                while (currentY < h && colorsMatch(data, pixelPos, targetR, targetG, targetB)) {
                    data[pixelPos] = fillColor.r;
                    data[pixelPos + 1] = fillColor.g;
                    data[pixelPos + 2] = fillColor.b;
                    data[pixelPos + 3] = 255;
                    
                    if (currentX > 0) {
                        if (colorsMatch(data, pixelPos - 4, targetR, targetG, targetB)) {
                            if (!reachLeft) { pixelStack.push([currentX - 1, currentY]); reachLeft = true; }
                        } else if (reachLeft) { reachLeft = false; }
                    }
                    if (currentX < w - 1) {
                        if (colorsMatch(data, pixelPos + 4, targetR, targetG, targetB)) {
                            if (!reachRight) { pixelStack.push([currentX + 1, currentY]); reachRight = true; }
                        } else if (reachRight) { reachRight = false; }
                    }
                    currentY++; pixelPos += w * 4;
                }
            }
            
            ctx.putImageData(imgData, 0, 0);
            playSound('ting');
            spawnSparkles(x, y);
            checkCompletion();
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return {
                x: Math.floor((clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.floor((clientY - rect.top) * (canvas.height / rect.height))
            };
        }

        const handleTap = (e) => {
            e.preventDefault();
            initAudio();
            if (isCompleted) return;
            const pos = getEventPos(e);
            floodFill(pos.x, pos.y, selectedColor);
        };

        canvas.addEventListener('mousedown', handleTap);
        canvas.addEventListener('touchstart', handleTap, {passive: false});

        clearBtn.addEventListener('click', () => { loadDrawing(); playSound('select'); });
        
        downloadBtn.addEventListener('click', () => {
            playSound('select');
            const link = document.createElement('a');
            link.download = `Mewarnai_${drawings[currentDrawingIndex]}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        nextBtn.addEventListener('click', () => {
            playSound('select');
            showSelectionScreen();
        });

        // Sparkles
        const cCanvas = document.getElementById('confetti-canvas');
        const cCtx = cCanvas.getContext('2d');
        let particles = [];

        function resizeConfetti() {
            cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function spawnSparkles(x, y) {
            const rect = canvas.getBoundingClientRect();
            const screenX = rect.left + x * (rect.width / canvas.width);
            const screenY = rect.top + y * (rect.height / canvas.height);
            
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: screenX, y: screenY,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5 + 3, color: '#FFF',
                    life: 1, decay: Math.random() * 0.05 + 0.02, type: 'sparkle'
                });
            }
        }

        function fireConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: cCanvas.width / 2, y: cCanvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1, decay: Math.random() * 0.01 + 0.005,
                    type: 'confetti', angle: Math.random() * 360, spin: (Math.random() - 0.5) * 10
                });
            }
        }

        function animateParticles() {
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                
                if (p.type === 'confetti') {
                    p.vy += 0.5; p.angle += p.spin;
                    cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.angle * Math.PI / 180);
                    cCtx.globalAlpha = Math.max(0, p.life); cCtx.fillStyle = p.color;
                    cCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size); cCtx.restore();
                } else {
                    cCtx.globalAlpha = Math.max(0, p.life); cCtx.fillStyle = '#FFFF00';
                    cCtx.beginPath(); cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); cCtx.fill();
                }
                if (p.life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('load', () => {
            setupSelection();
            showSelectionScreen();
        });
    </script>
</body>
</html>
