<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suara Siapa Ini?</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        #back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            z-index: 99999;
            transition: transform 0.15s;
            color: #333;
            pointer-events: auto;
            cursor: pointer;
        }

        #back-btn:active {
            transform: scale(0.9);
        }

        #round-counter {
            margin-top: max(20px, env(safe-area-inset-top));
            font-size: clamp(24px, 4vw, 36px);
            color: #555;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            color: #ff6b6b;
            text-shadow: 3px 3px 0px #fff, -3px -3px 0px #fff, 3px -3px 0px #fff, -3px 3px 0px #fff;
            text-align: center;
            margin: 15px 0 25px;
            padding: 0 10px;
        }

        #speaker-container {
            width: clamp(120px, 25vw, 170px);
            height: clamp(120px, 25vw, 170px);
            background: #ff9ff3;
            border: 4px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(60px, 12vw, 90px);
            box-shadow: 0 10px 25px rgba(255, 159, 243, 0.5), inset 0 -5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            margin-bottom: 30px;
            transition: transform 0.2s;
            position: relative;
        }

        #speaker-container:active {
            transform: scale(0.95);
        }

        .playing {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 159, 243, 0.8); }
            100% { transform: scale(1.1); box-shadow: 0 0 0 30px rgba(255, 159, 243, 0); }
        }

        #options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(12px, 3vw, 25px);
            max-width: 700px;
            padding: 0 20px 30px;
        }

        .option {
            width: clamp(90px, 20vw, 140px);
            height: clamp(90px, 20vw, 140px);
            background: white;
            border: 3px solid #ff9ff3;
            border-radius: 25px;
            font-size: clamp(55px, 12vw, 85px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .option:active {
            transform: scale(0.9) translateY(4px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .jump {
            animation: jump 0.6s ease-in-out;
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <a href="index.html" id="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="round-counter">
        <span id="round-text">Ronde 1</span>
        <span id="round-emoji">⭐</span>
    </div>

    <h1>Suara Siapa Ini?</h1>

    <div id="speaker-container" onclick="playCurrentAnimalSound()">
        🔊
    </div>

    <div id="options"></div>

    <canvas id="confetti"></canvas>

    <script>
        const animals = [
            { id: 'cow', emoji: '🐄', name: 'Sapi' },
            { id: 'chick', emoji: '🐤', name: 'Anak Ayam' },
            { id: 'dog', emoji: '🐶', name: 'Anjing' },
            { id: 'cat', emoji: '🐱', name: 'Kucing' },
            { id: 'duck', emoji: '🦆', name: 'Bebek' },
            { id: 'frog', emoji: '🐸', name: 'Katak' },
            { id: 'sheep', emoji: '🐑', name: 'Domba' },
            { id: 'lion', emoji: '🦁', name: 'Singa' },
            { id: 'elephant', emoji: '🐘', name: 'Gajah' },
            { id: 'bird', emoji: '🐦', name: 'Burung' },
            { id: 'pig', emoji: '🐷', name: 'Babi' },
            { id: 'horse', emoji: '🐴', name: 'Kuda' }
        ];

        let correctAnswersCount = 0;
        let currentAnimal = null;
        let isPlaying = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playFeedback(type) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        function playAnimalSound(type) {
            initAudio();
            const ctx = audioCtx;
            let duration = 1.0;
            
            try {
                if (type === 'cow') {
                    duration = 1.0;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + 0.8);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.0);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.0);
                } else if (type === 'chick') {
                    duration = 0.6;
                    for (let i = 0; i < 3; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, ctx.currentTime + i * 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.2);
                        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.2 + 0.05);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.2 + 0.1);
                        osc.start(ctx.currentTime + i * 0.2);
                        osc.stop(ctx.currentTime + i * 0.2 + 0.1);
                    }
                } else if (type === 'dog') {
                    duration = 0.6;
                    for (let i = 0; i < 2; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(300, ctx.currentTime + i * 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.3);
                        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.3 + 0.05);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.3 + 0.15);
                        osc.start(ctx.currentTime + i * 0.3);
                        osc.stop(ctx.currentTime + i * 0.3 + 0.15);
                    }
                } else if (type === 'cat') {
                    duration = 0.6;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'duck') {
                    duration = 0.8;
                    for (let i = 0; i < 2; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(350, ctx.currentTime + i * 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.4);
                        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.4 + 0.1);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.4 + 0.25);
                        osc.start(ctx.currentTime + i * 0.4);
                        osc.stop(ctx.currentTime + i * 0.4 + 0.25);
                    }
                } else if (type === 'frog') {
                    duration = 0.5;
                    for (let i = 0; i < 4; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(200, ctx.currentTime + i * 0.1);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
                        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + i * 0.1 + 0.02);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.1 + 0.08);
                        osc.start(ctx.currentTime + i * 0.1);
                        osc.stop(ctx.currentTime + i * 0.1 + 0.08);
                    }
                } else if (type === 'sheep') {
                    duration = 0.8;
                    const osc = ctx.createOscillator();
                    const lfo = ctx.createOscillator();
                    const lfoGain = ctx.createGain();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, ctx.currentTime);
                    lfo.type = 'sine';
                    lfo.frequency.setValueAtTime(10, ctx.currentTime);
                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    lfoGain.gain.setValueAtTime(0.2, ctx.currentTime);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + 0.7);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
                    
                    osc.start();
                    lfo.start();
                    osc.stop(ctx.currentTime + 0.8);
                    lfo.stop(ctx.currentTime + 0.8);
                } else if (type === 'lion') {
                    duration = 1.2;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.6);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 1.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + 0.8);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.2);
                } else if (type === 'elephant') {
                    duration = 1.5;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime + 1.0);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } else if (type === 'bird') {
                    duration = 0.9;
                    for (let i = 0; i < 6; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1000, ctx.currentTime + i * 0.15);
                        osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + i * 0.15 + 0.05);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
                        gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i * 0.15 + 0.02);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.15 + 0.1);
                        osc.start(ctx.currentTime + i * 0.15);
                        osc.stop(ctx.currentTime + i * 0.15 + 0.1);
                    }
                } else if (type === 'pig') {
                    duration = 0.9;
                    for (let i = 0; i < 3; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(250, ctx.currentTime + i * 0.3);
                        osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + i * 0.3 + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.3);
                        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.3 + 0.05);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.3 + 0.15);
                        osc.start(ctx.currentTime + i * 0.3);
                        osc.stop(ctx.currentTime + i * 0.3 + 0.15);
                    }
                } else if (type === 'horse') {
                    duration = 1.0;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.5);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 1.0);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + 0.8);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.0);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.0);
                }
            } catch(e) {}

            const speaker = document.getElementById('speaker-container');
            speaker.classList.add('playing');
            isPlaying = true;
            
            setTimeout(() => {
                speaker.classList.remove('playing');
                isPlaying = false;
            }, duration * 1000);
        }

        function playCurrentAnimalSound() {
            if (currentAnimal && !isPlaying) {
                playAnimalSound(currentAnimal.id);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startRound() {
            document.getElementById('round-text').innerText = `Ronde ${correctAnswersCount + 1}`;
            
            const numOptions = correctAnswersCount >= 10 ? 4 : 3;
            
            const shuffled = shuffleArray([...animals]);
            const selectedOptions = shuffled.slice(0, numOptions);
            currentAnimal = selectedOptions[Math.floor(Math.random() * selectedOptions.length)];
            
            document.getElementById('round-emoji').innerText = currentAnimal.emoji;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            selectedOptions.forEach(animal => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = animal.emoji;
                btn.onclick = () => checkAnswer(animal, btn);
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => {
                playCurrentAnimalSound();
            }, 400);
        }

        function checkAnswer(animal, btnElement) {
            if (animal.id === currentAnimal.id) {
                btnElement.classList.add('jump');
                playFeedback('success');
                shootConfetti();
                
                correctAnswersCount++;
                
                setTimeout(() => {
                    startRound();
                }, 1400);
            } else {
                playCurrentAnimalSound();
            }
        }

        // Confetti System
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function shootConfetti() {
            const colors = ['#ff9ff3', '#feca57', '#ff6b6b', '#48dbfb', '#1dd1a1'];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 50,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: Math.random() * 0.015 + 0.015
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.life -= p.decay;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        window.addEventListener('click', () => {
            initAudio();
        }, { once: true });
        
        startRound();
    </script>
</body>
</html>
