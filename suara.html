<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Siapa Suaranya? 🔊</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #fd79a8;
            --bg-end: #ffeaa7;
            --primary: #e84393;
            --secondary: #6c5ce7;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #d63031;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        .play-sound-btn {
            width: clamp(130px, 25vw, 170px);
            height: clamp(130px, 25vw, 170px);
            border-radius: 50%;
            background: linear-gradient(135deg, #e84393, #d63031);
            border: 6px solid white;
            color: white;
            font-size: clamp(55px, 11vw, 85px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(232, 67, 147, 0.4);
            transition: transform 0.15s;
            margin: 20px 0;
            animation: pulse 1.5s infinite alternate;
        }

        .play-sound-btn:active {
            transform: scale(0.92);
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(14px, 3.5vw, 24px);
            max-width: 680px;
            width: 100%;
        }

        .option-card {
            width: clamp(95px, 20vw, 135px);
            height: clamp(95px, 20vw, 135px);
            background: white;
            border: 4px solid #fd79a8;
            border-radius: 28px;
            font-size: clamp(48px, 9.5vw, 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 5px;
        }

        .option-card span {
            font-size: clamp(13px, 2.3vw, 16px);
            font-weight: bold;
            color: #2d3436;
            margin-top: 2px;
        }

        .option-card:hover {
            transform: scale(1.08);
        }

        .option-card:active {
            transform: scale(0.95);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--secondary); }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Siapa Suaranya? 🔊</h1>
            <p style="font-size: clamp(20px, 4vw, 28px); color: #2d3436; margin-bottom: 20px;">Dengarkan sampel suara asli hewan lalu tebak hewannya!</p>
            <button class="btn" style="background: #e84393; color: white; border-color: #d63031;" onclick="startGame()">Mulai Tebak! 🔊</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <h2 style="font-size: clamp(24px, 4.5vw, 36px); color: #d63031; margin-top: max(10px, env(safe-area-inset-top));">Tekan Tombol & Dengarkan Suara Aslinya!</h2>
            <div class="play-sound-btn" onclick="playSoundPrompt()" title="Putar Suara">🔊</div>
            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <h1 style="color: #00b894;">Pintar sekali! 🎉</h1>
            <div style="font-size: 90px; margin: 15px 0;" id="celeb-emoji">🐮</div>
            <h2 id="celeb-name" style="color: #2d3436; margin-bottom: 20px;">Sapi</h2>
            <button class="btn" style="background: #00b894; color: white; border-color: #00876c;" onclick="nextQuestion()">Suara Berikutnya!</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // Real Animal Sound Sample URLs (Wikimedia Commons open audio files)
        const animals = [
            { 
                id: 'cow', name: 'Sapi', emoji: '🐮', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/e/e0/Cow_moo.ogg',
                speech: 'Moo! Sapi!'
            },
            { 
                id: 'cat', name: 'Kucing', emoji: '🐱', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat_meow.ogg',
                speech: 'Meow! Kucing!'
            },
            { 
                id: 'dog', name: 'Anjing', emoji: '🐶', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/0/05/Dog_barking.ogg',
                speech: 'Woof woof! Anjing!'
            },
            { 
                id: 'duck', name: 'Bebek', emoji: '🦆', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/8/87/Mallard_duck_quack.ogg',
                speech: 'Kwek kwek! Bebek!'
            },
            { 
                id: 'rooster', name: 'Ayam', emoji: '🐓', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/5/52/Rooster_crowing.ogg',
                speech: 'Kukuruyuk! Ayam!'
            },
            { 
                id: 'sheep', name: 'Domba', emoji: '🐑', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Sheep_bleat.ogg',
                speech: 'Mbee! Domba!'
            },
            { 
                id: 'lion', name: 'Singa', emoji: '🦁', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/4b/Lion_roar.ogg',
                speech: 'Roar! Singa!'
            },
            { 
                id: 'bird', name: 'Burung', emoji: '🐦', 
                soundUrl: 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Bird_chirping.ogg',
                speech: 'Cip cip! Burung!'
            }
        ];

        let currentTarget = null;
        let options = [];
        let currentAudio = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            nextQuestion();
        }

        function nextQuestion() {
            showScreen('game-screen');
            currentTarget = animals[Math.floor(Math.random() * animals.length)];
            
            // Pick 3 distractor animals
            let pool = animals.filter(a => a.id !== currentTarget.id);
            pool.sort(() => Math.random() - 0.5);
            options = [currentTarget, pool[0], pool[1], pool[2]];
            options.sort(() => Math.random() - 0.5);

            renderOptions();
            setTimeout(playSoundPrompt, 400);
        }

        function playSoundPrompt() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            // Try playing REAL ANIMAL AUDIO SAMPLE
            currentAudio = new Audio(currentTarget.soundUrl);
            currentAudio.play().catch(() => {
                // Fallback to SpeechSynthesis voice if offline or network blocked
                speakFallback(currentTarget.speech);
            });
        }

        function speakFallback(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'id-ID';
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function renderOptions() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `${opt.emoji}<span>${opt.name}</span>`;
                card.onclick = () => checkAnswer(opt);
                grid.appendChild(card);
            });
        }

        function checkAnswer(opt) {
            if (opt.id === currentTarget.id) {
                document.getElementById('celeb-emoji').innerText = currentTarget.emoji;
                document.getElementById('celeb-name').innerText = currentTarget.name;
                showScreen('celeb-screen');
            } else {
                playSoundPrompt();
            }
        }
    </script>
</body>
</html>
