<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Siapa Suaranya? 🔊</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #fd79a8;
            --bg-end: #ffeaa7;
            --primary: #e84393;
            --secondary: #6c5ce7;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #d63031;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        .play-sound-btn {
            width: clamp(120px, 25vw, 160px);
            height: clamp(120px, 25vw, 160px);
            border-radius: 50%;
            background: #e84393;
            border: 6px solid white;
            color: white;
            font-size: clamp(50px, 10vw, 75px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(232, 67, 147, 0.4);
            transition: transform 0.15s;
            margin: 20px 0;
        }

        .play-sound-btn:active {
            transform: scale(0.92);
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(12px, 3vw, 22px);
            max-width: 650px;
            width: 100%;
        }

        .option-card {
            width: clamp(90px, 20vw, 130px);
            height: clamp(90px, 20vw, 130px);
            background: white;
            border: 4px solid #fd79a8;
            border-radius: 28px;
            font-size: clamp(45px, 9vw, 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-card:hover {
            transform: scale(1.08);
        }

        .option-card:active {
            transform: scale(0.95);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--secondary); }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Siapa Suaranya? 🔊</h1>
            <p style="font-size: clamp(20px, 4vw, 28px); color: #2d3436; margin-bottom: 20px;">Dengarkan suara lalu tebak hewan yang mana!</p>
            <button class="btn" style="background: #e84393; color: white; border-color: #d63031;" onclick="startGame()">Mulai Tebak! 🔊</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <h2 style="font-size: clamp(24px, 4.5vw, 36px); color: #d63031; margin-top: max(10px, env(safe-area-inset-top));">Tekan Tombol & Tebak Suaranya!</h2>
            <div class="play-sound-btn" onclick="playSoundPrompt()">🔊</div>
            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <h1 style="color: #00b894;">Pintar sekali! 🎉</h1>
            <div style="font-size: 80px; margin: 15px 0;" id="celeb-emoji">🐮</div>
            <button class="btn" style="background: #00b894; color: white; border-color: #00876c;" onclick="nextQuestion()">Suara Berikutnya!</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const animals = [
            { id: 'cow', name: 'Sapi', emoji: '🐮', freq: 150, type: 'sawtooth' },
            { id: 'cat', name: 'Kucing', emoji: '🐱', freq: 600, type: 'sine' },
            { id: 'dog', name: 'Anjing', emoji: '🐶', freq: 300, type: 'square' },
            { id: 'duck', name: 'Bebek', emoji: '🦆', freq: 400, type: 'sawtooth' },
            { id: 'frog', name: 'Katak', emoji: '🐸', freq: 200, type: 'triangle' },
            { id: 'bird', name: 'Burung', emoji: '🐦', freq: 900, type: 'sine' },
            { id: 'dino', name: 'Dino', emoji: '🦖', freq: 120, type: 'sawtooth' },
            { id: 'lion', name: 'Singa', emoji: '🦁', freq: 100, type: 'square' }
        ];

        let currentTarget = null;
        let options = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            nextQuestion();
        }

        function nextQuestion() {
            showScreen('game-screen');
            currentTarget = animals[Math.floor(Math.random() * animals.length)];
            
            // Pick 3 distractor animals
            let pool = animals.filter(a => a.id !== currentTarget.id);
            pool.sort(() => Math.random() - 0.5);
            options = [currentTarget, pool[0], pool[1], pool[2]];
            options.sort(() => Math.random() - 0.5);

            renderOptions();
            setTimeout(playSoundPrompt, 400);
        }

        function playSoundPrompt() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                osc.type = currentTarget.type;
                osc.frequency.setValueAtTime(currentTarget.freq, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(currentTarget.freq * 1.2, ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                
                osc.start(); osc.stop(ctx.currentTime + 0.6);
            } catch(e) {}
        }

        function renderOptions() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerText = opt.emoji;
                card.onclick = () => checkAnswer(opt);
                grid.appendChild(card);
            });
        }

        function checkAnswer(opt) {
            if (opt.id === currentTarget.id) {
                document.getElementById('celeb-emoji').innerText = currentTarget.emoji;
                showScreen('celeb-screen');
            } else {
                playSoundPrompt();
            }
        }
    </script>
</body>
</html>
