<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mengingat Teman! 🧠</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #a1c4fd;
            --bg-end: #c2e9fb;
            --primary: #4facfe;
            --secondary: #6c5ce7;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #6c5ce7;
            text-shadow: 3px 3px 0px white, -3px -3px 0px white, 3px -3px 0px white, -3px 3px 0px white;
            animation: bounce 2s infinite ease-in-out;
        }

        h2 {
            font-size: clamp(22px, 3.8vw, 32px);
            color: #0984e3;
            margin: 8px 0 12px;
            text-shadow: 1px 1px 0 #fff;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 18px);
            max-width: 680px;
            margin-bottom: 20px;
        }

        .picker-card {
            width: clamp(75px, 16vw, 105px);
            height: clamp(75px, 16vw, 105px);
            background: white;
            border: 4px solid #74b9ff;
            border-radius: 24px;
            font-size: clamp(38px, 8vw, 56px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 5px;
        }

        .picker-card span {
            font-size: clamp(12px, 2.2vw, 15px);
            font-weight: bold;
            color: #2d3436;
            margin-top: 2px;
        }

        .picker-card:hover { transform: scale(1.08); }

        .picker-card.selected {
            background: #ffe082;
            border-color: #ff4081;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.4);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s, box-shadow 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--secondary);
        }

        .btn.btn-primary {
            background: #6c5ce7;
            color: white;
            border-color: #a29bfe;
            box-shadow: 0 6px 0 #3c40c6;
        }
        .btn.btn-primary:active { box-shadow: 0 0 0 #3c40c6; }

        /* Memory Card Grid */
        #game-grid {
            display: grid;
            gap: 12px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            max-width: 900px;
            width: 100%;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        .memory-card {
            aspect-ratio: 1;
            background: white;
            border: 3.5px solid #74b9ff;
            border-radius: 20px;
            font-size: clamp(32px, 7vw, 54px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #0984e3;
            transition: transform 0.3s ease, background-color 0.2s;
            transform-style: preserve-3d;
        }

        .memory-card:active {
            transform: scale(0.95);
        }

        .memory-card.flipped {
            background: #ffeaa7;
            border-color: #fdcb6e;
            box-shadow: 0 6px 0 #e1b12c;
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            background: #55efc4;
            border-color: #00b894;
            box-shadow: 0 2px 0 #00b894;
            pointer-events: none;
            opacity: 0.9;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .celeb-text {
            font-size: clamp(50px, 10vw, 75px);
            color: #00b894;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 white;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Mengingat Teman! 🧠</h1>

            <h2>1. Pilih Tema Gambar:</h2>
            <div class="picker-grid" id="theme-grid"></div>

            <h2>2. Pilih Jumlah Kartu:</h2>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
                <button class="btn" onclick="startGame(6)">⭐ 6 Kartu</button>
                <button class="btn" onclick="startGame(12)">⭐⭐ 12 Kartu</button>
                <button class="btn" onclick="startGame(16)">⭐⭐⭐ 16 Kartu</button>
            </div>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-grid"></div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <div class="celeb-text">Ingatanmu Hebat! 🎉</div>
            <div style="font-size: 80px; margin: 15px 0;">⭐ 🧠 ⭐</div>
            <button class="btn btn-primary" onclick="showScreen('start-screen')">Main Lagi!</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const themes = [
            { id: 'animals', name: 'Hewan', emoji: '🐱', items: ['🐱', '🐶', '🐰', '🐸', '🐼', '🐻', '🦊', '🦁', '🦖', '🦄'] },
            { id: 'fruits', name: 'Buah', emoji: '🍎', items: ['🍎', '🍌', '🍇', '🍓', '🍉', '🍍', '🍒', '🍑', '🥑', '🍋'] },
            { id: 'dinos', name: 'Dino', emoji: '🦖', items: ['🦖', '🦕', '🐊', '🦎', '🐍', '🐢', '🐉', '🐲', '🥚', '🌋'] },
            { id: 'vehicles', name: 'Mobil', emoji: '🚗', items: ['🚗', '🚀', '✈️', '⛵', '🚂', '🚁', '🚜', '🚑', '🚒', '🚲'] },
            { id: 'numbers', name: 'Angka', emoji: '🔢', items: ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'] }
        ];

        let selectedTheme = themes[0];

        function renderThemePicker() {
            const grid = document.getElementById('theme-grid');
            grid.innerHTML = '';
            themes.forEach(t => {
                const card = document.createElement('div');
                card.className = `picker-card ${t.id === selectedTheme.id ? 'selected' : ''}`;
                card.innerHTML = `${t.emoji}<span>${t.name}</span>`;
                card.onclick = () => {
                    playAudioTone(600, 0.1);
                    selectedTheme = t;
                    renderThemePicker();
                };
                grid.appendChild(card);
            });
        }

        // Audio
        function playAudioTone(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        // Game State
        let cardsCount = 6;
        let flippedCards = [];
        let matchedPairs = 0;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame(count) {
            cardsCount = count;
            matchedPairs = 0;
            flippedCards = [];
            showScreen('game-screen');
            initCards();
        }

        function initCards() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            const cols = cardsCount <= 6 ? 3 : (cardsCount <= 12 ? 4 : 4);
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            const numPairs = cardsCount / 2;
            let deck = selectedTheme.items.slice(0, numPairs);
            deck = [...deck, ...deck];
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.val = item;
                card.dataset.idx = idx;
                card.innerText = '❓';

                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playAudioTone(500, 0.1);
            card.classList.add('flipped');
            card.innerText = card.dataset.val;
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                const [c1, c2] = flippedCards;
                if (c1.dataset.val === c2.dataset.val) {
                    playAudioTone(800, 0.2);
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    flippedCards = [];
                    matchedPairs++;
                    if (matchedPairs === cardsCount / 2) {
                        setTimeout(() => {
                            playAudioTone(1000, 0.4);
                            showScreen('celeb-screen');
                        }, 500);
                    }
                } else {
                    setTimeout(() => {
                        playAudioTone(250, 0.2);
                        c1.classList.remove('flipped');
                        c2.classList.remove('flipped');
                        c1.innerText = '❓';
                        c2.innerText = '❓';
                        flippedCards = [];
                    }, 900);
                }
            }
        }

        renderThemePicker();
    </script>
</body>
</html>
