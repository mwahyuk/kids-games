<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cari Pasangannya!</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #333;
        }

        .home-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .home-btn:active {
            transform: scale(0.9);
        }

        h1 {
            font-size: clamp(32px, 6vw, 64px);
            color: #ff6b6b;
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            margin-bottom: 15px;
            text-align: center;
            padding: 0 20px;
            margin-top: max(20px, env(safe-area-inset-top));
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            z-index: 10;
        }

        .screen.active {
            display: flex;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            font-size: clamp(28px, 5vw, 48px);
            color: #4834d4;
            text-shadow: 2px 2px 0 #fff;
            margin-bottom: 20px;
            text-align: center;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 100%);
            border: 3px solid #fff;
            border-radius: 25px;
            padding: 16px 24px;
            font-size: clamp(24px, 4vw, 36px);
            color: #d63031;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1), inset 0 -4px 0 rgba(0,0,0,0.1);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-shadow: 1px 1px 0 #fff;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1), inset 0 -2px 0 rgba(0,0,0,0.1);
        }

        .btn-blue {
            background: linear-gradient(to bottom, #89f7fe 0%, #66a6ff 100%);
            color: #0984e3;
        }

        .btn-green {
            background: linear-gradient(to bottom, #a8ff78, #78ffd6);
            color: #006266;
        }

        .btn-purple {
            background: linear-gradient(to bottom, #e0c3fc 0%, #8ec5fc 100%);
            color: #6c5ce7;
        }

        .progress {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: clamp(28px, 4vw, 40px);
        }

        .heart {
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .heart.filled {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
            animation: heartPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        .game-board {
            display: grid;
            gap: clamp(10px, 2vw, 20px);
            padding: 15px;
            max-width: 95vw;
            justify-content: center;
        }

        .card {
            width: clamp(80px, 15vw, 130px);
            height: clamp(100px, 18vw, 150px);
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg) scale(0.95);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(40px, 8vw, 70px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border: 4px solid #fff;
        }

        .card-front::after {
            content: '?';
            color: rgba(255,255,255,0.85);
            font-size: clamp(45px, 9vw, 75px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card-back {
            background: #fff;
            transform: rotateY(180deg);
            border: 4px solid #74b9ff;
        }

        .card.matched .card-back {
            background: #e3f2fd;
            border-color: #55efc4;
            box-shadow: 0 0 20px rgba(85, 239, 196, 0.6);
            animation: matchedPulse 1s infinite alternate;
        }

        @keyframes matchedPulse {
            from { box-shadow: 0 0 10px rgba(85, 239, 196, 0.4); }
            to { box-shadow: 0 0 25px rgba(85, 239, 196, 0.8); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .celebration-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
            width: 100%;
            max-width: 380px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn" title="Ke Halaman Utama" onclick="window.location.href='index.html'; return true;">🏠</a>
    
    <canvas id="confetti-canvas"></canvas>

    <!-- Tema Screen -->
    <div id="screen-theme" class="screen active">
        <h1>Cari Pasangannya!</h1>
        <h2>Pilih Tema</h2>
        <div class="menu-grid">
            <button class="btn btn-green" onclick="selectTheme('hewan')">
                <span style="font-size: 1.2em;">🐾</span> Hewan
            </button>
            <button class="btn btn-blue" onclick="selectTheme('buah')">
                <span style="font-size: 1.2em;">🍎</span> Buah
            </button>
            <button class="btn btn-purple" onclick="selectTheme('kendaraan')">
                <span style="font-size: 1.2em;">🚗</span> Kendaraan
            </button>
        </div>
    </div>

    <!-- Difficulty Screen -->
    <div id="screen-difficulty" class="screen">
        <h1>Cari Pasangannya!</h1>
        <h2>Pilih Tingkat Kesulitan</h2>
        <div class="menu-grid">
            <button class="btn btn-green" onclick="startGame('mudah')">
                ⭐ Mudah (2x2)
            </button>
            <button class="btn btn-blue" onclick="startGame('sedang')">
                ⭐⭐ Sedang (4x2)
            </button>
            <button class="btn btn-purple" onclick="startGame('sulit')">
                ⭐⭐⭐ Sulit (3x4)
            </button>
            <button class="btn" onclick="showScreen('screen-theme')" style="margin-top: 10px; font-size: 24px; background: #fff; color: #555;">
                ⬅️ Kembali
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
        <div class="progress" id="progress-bar"></div>
        <div class="game-board" id="game-board"></div>
    </div>

    <!-- Celebration Screen -->
    <div id="screen-win" class="screen">
        <h1 style="font-size: clamp(50px, 10vw, 80px);">Horeee! 🎉</h1>
        <h2>Kamu Hebat!</h2>
        <div class="celebration-btns">
            <button class="btn btn-green" onclick="startGame(currentDifficulty)">
                🔄 Main Lagi
            </button>
            <button class="btn btn-blue" onclick="showScreen('screen-theme')">
                📋 Kembali ke Menu
            </button>
        </div>
    </div>

    <script>
        const themes = {
            hewan: ['🐶', '🐱', '🐰', '🐸', '🦁', '🐻', '🐼', '🐨', '🐷', '🦊'],
            buah: ['🍎', '🍊', '🍌', '🍓', '🍇', '🍉', '🍑', '🥝', '🍍', '🍒'],
            kendaraan: ['🚗', '🚌', '🚂', '✈️', '🚀', '🚲', '🚁', '🛸', '🚜', '🛥️']
        };

        const grids = {
            mudah: { cols: 2, pairs: 2 },
            sedang: { cols: 4, pairs: 4 },
            sulit: { cols: 4, pairs: 6 } // 4x3 layout for better fit
        };

        let currentTheme = 'hewan';
        let currentDifficulty = 'sedang';
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let isLocked = false;

        // Audio System
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'match') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.setValueAtTime(400, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(500, ctx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.3);
                    osc.frequency.setValueAtTime(800, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.8);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {}
        }

        function showScreen(screenId) {
            playSound('click');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectTheme(theme) {
            currentTheme = theme;
            showScreen('screen-difficulty');
        }

        function startGame(diff) {
            currentDifficulty = diff;
            const config = grids[diff];
            totalPairs = config.pairs;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            
            showScreen('screen-game');
            setupBoard(config);
            renderHearts();
        }

        function setupBoard(config) {
            const board = document.getElementById('game-board');
            
            // Adjust cols based on orientation if landscape
            let cols = config.cols;
            if (window.innerWidth > window.innerHeight && config.pairs === 6) {
                cols = 4;
            }
            
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.innerHTML = '';

            let items = [...themes[currentTheme]].sort(() => 0.5 - Math.random()).slice(0, config.pairs);
            
            cards = [...items, ...items]
                .sort(() => 0.5 - Math.random())
                .map((emoji, index) => ({ id: index, emoji, isFlipped: false, isMatched: false }));

            cards.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.id = card.id;
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">${card.emoji}</div>
                    </div>
                `;
                cardEl.addEventListener('click', () => flipCard(cardEl, card));
                board.appendChild(cardEl);
            });
        }

        function renderHearts() {
            const progress = document.getElementById('progress-bar');
            progress.innerHTML = '';
            for(let i=0; i<totalPairs; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                progress.appendChild(heart);
            }
        }

        function updateProgress() {
            const hearts = document.querySelectorAll('.heart');
            for(let i=0; i<matchedPairs; i++) {
                if(!hearts[i].classList.contains('filled')) {
                    hearts[i].classList.add('filled');
                }
            }
        }

        function flipCard(cardEl, card) {
            if (isLocked || card.isFlipped || card.isMatched) return;
            
            playSound('pop');
            card.isFlipped = true;
            cardEl.classList.add('flipped');
            flippedCards.push({ cardEl, card });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [first, second] = flippedCards;
            const isMatch = first.card.emoji === second.card.emoji;

            if (isMatch) {
                setTimeout(() => {
                    playSound('match');
                    first.card.isMatched = true;
                    second.card.isMatched = true;
                    first.cardEl.classList.add('matched');
                    second.cardEl.classList.add('matched');
                    matchedPairs++;
                    updateProgress();
                    resetBoard();

                    if (matchedPairs === totalPairs) {
                        setTimeout(winGame, 500);
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    first.card.isFlipped = false;
                    second.card.isFlipped = false;
                    first.cardEl.classList.remove('flipped');
                    second.cardEl.classList.remove('flipped');
                    resetBoard();
                }, 900);
            }
        }

        function resetBoard() {
            flippedCards = [];
            isLocked = false;
        }

        function winGame() {
            playSound('win');
            showScreen('screen-win');
            fireConfetti();
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            confetti = [];
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81'];
            
            for(let i = 0; i < 100; i++) {
                confetti.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            confetti.forEach(c => {
                c.tiltAngle += c.tiltAngleInc;
                c.y += (Math.cos(c.tiltAngle) + 1 + c.r / 2) / 2;
                c.x += Math.sin(c.tiltAngle) * 2;
                c.dy += 0.2; // gravity
                c.y += c.dy;
                c.x += c.dx;

                if(c.y < canvas.height) active = true;

                ctx.beginPath();
                ctx.lineWidth = c.r;
                ctx.strokeStyle = c.color;
                ctx.moveTo(c.x + c.tilt + c.r, c.y);
                ctx.lineTo(c.x + c.tilt, c.y + c.tilt + c.r);
                ctx.stroke();
            });

            if(active) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
