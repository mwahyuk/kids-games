<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mengingat Teman! 🧠</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        :root {
            --bg-start: #a8c0ff;
            --bg-end: #3f2b96;
            --primary: #ff7675;
            --secondary: #fdcb6e;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        .back-btn:active { transform: scale(0.9); }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #ffeaa7;
            text-shadow: 3px 3px 0px #d63031, -3px -3px 0px #d63031, 3px -3px 0px #d63031, -3px 3px 0px #d63031;
            animation: bounce 2s infinite ease-in-out;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(12px, 3vw, 20px);
            max-width: 720px;
            margin-bottom: 25px;
        }

        .picker-card {
            width: clamp(90px, 18vw, 130px);
            height: clamp(90px, 18vw, 130px);
            background: white;
            border: 4px solid #fdcb6e;
            border-radius: 28px;
            font-size: clamp(45px, 9vw, 65px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 0 #d4af37, 0 12px 20px rgba(0,0,0,0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 5px;
        }

        .picker-card span {
            font-size: clamp(14px, 2.4vw, 17px);
            font-weight: bold;
            color: #2d3436;
            margin-top: 4px;
        }

        .picker-card:hover { transform: scale(1.08); }
        .picker-card.selected {
            background: #ffe082;
            border-color: #ff7675;
            transform: scale(1.15);
            box-shadow: 0 8px 0 #e17055, 0 0 25px rgba(255, 118, 117, 0.5);
        }

        .btn {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(22px, 4vw, 32px);
            font-family: inherit;
            color: #2d3436;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 6px 0 var(--secondary);
            transition: transform 0.1s;
            width: clamp(200px, 55vw, 280px);
        }

        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--secondary); }

        #cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 18px);
            max-width: 680px;
            width: 100%;
            margin-top: max(10px, env(safe-area-inset-top));
        }

        .card-3d {
            width: clamp(75px, 16vw, 110px);
            height: clamp(75px, 16vw, 110px);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-3d:active {
            transform: scale(0.92);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card-back, .card-front {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-back {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            border: 4px solid white;
            font-size: clamp(35px, 7vw, 50px);
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .card-front {
            background: white;
            border: 4px solid #74b9ff;
            font-size: clamp(42px, 8.5vw, 64px);
            font-weight: bold;
            color: #6c5ce7;
            opacity: 0;
            transform: scale(0) rotate(-10deg);
            pointer-events: none;
        }

        .card-3d.flipped .card-back {
            opacity: 0;
            transform: scale(0) rotate(10deg);
        }

        .card-3d.flipped .card-front {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            pointer-events: auto;
        }

        .card-3d.matched {
            pointer-events: none;
            opacity: 0.85;
            animation: pulse 0.5s;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="screens">
        <!-- 1. Selection Screen -->
        <div id="start-screen" class="screen active">
            <h1>Mengingat Teman! 🧠</h1>

            <h2 style="color: #ffeaa7;">Pilih Tema Kartu 3D:</h2>
            <div class="picker-grid" id="theme-grid"></div>

            <button class="btn" style="background: #fdcb6e; font-weight: bold;" onclick="startGame()">Mulai Main! 🧠</button>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen">
            <h2 style="color: #ffeaa7; margin-top: max(10px, env(safe-area-inset-top));">Cari Pasangan Kartu Yang Sama!</h2>
            <div id="cards-grid"></div>
        </div>

        <!-- 3. Celebration Screen -->
        <div id="celeb-screen" class="screen">
            <h1 style="color: #00b894;">Ingatan Luar Biasa! 🎉</h1>
            <div style="font-size: 90px; margin: 15px 0;">⭐ 🧠 ⭐</div>
            <button class="btn" style="background: #00b894; color: white;" onclick="showScreen('start-screen')">Main Lagi!</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const themes = [
            { id: 'animal', name: 'Hewan 3D', icon: '🦁', items: ['🦁', '🐱', '🐶', '🐰', '🐼', '🦖'] },
            { id: 'fruit', name: 'Buah 3D', icon: '🍎', items: ['🍎', '🍌', '🍓', '🍇', '🍉', '🍍'] },
            { id: 'toy', name: 'Mainan 3D', icon: '🚗', items: ['🚗', '🚀', '🎁', '⭐', '🎈', '🏆'] },
            { id: 'number', name: 'Angka 3D', icon: '🔢', items: ['1', '2', '3', '4', '5', '6'] }
        ];

        let selectedTheme = themes[0];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;

        function renderThemePicker() {
            const grid = document.getElementById('theme-grid');
            grid.innerHTML = '';
            themes.forEach(t => {
                const card = document.createElement('div');
                card.className = `picker-card ${t.id === selectedTheme.id ? 'selected' : ''}`;
                card.innerHTML = `${t.icon}<span>${t.name}</span>`;
                card.onclick = () => {
                    playAudioTone(600, 0.1);
                    selectedTheme = t;
                    renderThemePicker();
                };
                grid.appendChild(card);
            });
        }

        function playAudioTone(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            matchedPairs = 0;
            flippedCards = [];

            // Duplicate items to make pairs & shuffle
            let items = [...selectedTheme.items, ...selectedTheme.items];
            items.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card-3d';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">❓</div>
                        <div class="card-front">${item}</div>
                    </div>
                `;
                card.onclick = () => flipCard(card, item);
                grid.appendChild(card);
            });
        }

        function flipCard(card, item) {
            if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playAudioTone(800, 0.1);
            card.classList.add('flipped');
            flippedCards.push({ card, item });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.item === c2.item) {
                playAudioTone(1200, 0.2);
                c1.card.classList.add('matched');
                c2.card.classList.add('matched');
                matchedPairs++;
                flippedCards = [];

                if (matchedPairs === selectedTheme.items.length) {
                    setTimeout(() => {
                        playAudioTone(1500, 0.4);
                        showScreen('celeb-screen');
                    }, 600);
                }
            } else {
                setTimeout(() => {
                    playAudioTone(300, 0.2);
                    c1.card.classList.remove('flipped');
                    c2.card.classList.remove('flipped');
                    flippedCards = [];
                }, 900);
            }
        }

        renderThemePicker();
    </script>
</body>
</html>
