<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menghitung Jari! 🔢</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #444;
        }

        #home-button {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 99999;
            text-decoration: none;
            font-size: 32px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        #home-button:active {
            transform: scale(0.9);
        }

        #progress-bar {
            margin-top: max(15px, env(safe-area-inset-top));
            font-size: clamp(24px, 4vw, 36px);
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            padding: 0 80px;
            z-index: 10;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin: 5px 0 15px;
            color: #ff6b6b;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            text-align: center;
            z-index: 10;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 10px 20px 30px;
            z-index: 10;
        }

        #question-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            padding: 20px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            margin-bottom: 30px;
            width: 100%;
            gap: 15px;
        }

        .object {
            font-size: clamp(48px, 10vw, 72px);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .operator {
            font-size: clamp(48px, 10vw, 72px);
            color: #4a69bd;
            font-weight: bold;
            margin: 0 15px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .object-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        #choices-container {
            display: flex;
            justify-content: center;
            gap: clamp(15px, 3vw, 30px);
            flex-wrap: wrap;
            width: 100%;
            max-width: 700px;
        }

        .choice-btn {
            background: #fff;
            border: 3.5px solid #4a69bd;
            border-radius: 25px;
            width: clamp(90px, 20vw, 140px);
            height: clamp(90px, 20vw, 140px);
            font-size: clamp(40px, 8vw, 64px);
            font-family: 'Bubblegum Sans', cursive;
            color: #4a69bd;
            cursor: pointer;
            box-shadow: 0 8px 0 #3b5998, 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .choice-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #3b5998, 0 4px 10px rgba(0,0,0,0.1);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

    <a href="index.html" id="home-button" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="progress-bar"></div>

    <h1>Menghitung Jari! 🔢</h1>

    <div id="game-area">
        <div id="question-container">
            <!-- Objects will be injected here -->
        </div>
        <div id="choices-container">
            <!-- Buttons will be injected here -->
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const themes = {
            buah: ['🍎', '🍊', '🍌', '🍓', '🍇', '🍉', '🍑', '🥝'],
            hewan: ['🐶', '🐱', '🐰', '🐸', '🦁', '🐻', '🐼', '🐨'],
            kendaraan: ['🚗', '🚌', '🚂', '✈️', '🚀', '🚲', '🚁', '🛸']
        };

        let correctCount = 0;
        let isAnimating = false;

        // Audio System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnConfetti() {
            particles = [];
            const colors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3'];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rs: (Math.random() - 0.5) * 10
                });
            }
            confettiActive = true;
            animateConfetti();
        }

        function animateConfetti() {
            if (!confettiActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = 0;

            particles.forEach(p => {
                p.vy += 0.5; // gravity
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rs;

                if (p.y < canvas.height + 50) {
                    activeParticles++;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                }
            });

            if (activeParticles > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiActive = false;
            }
        }

        function updateProgressBar() {
            const starCount = Math.floor(correctCount / 5);
            const pb = document.getElementById('progress-bar');
            pb.innerHTML = '';
            for (let i = 0; i < starCount; i++) {
                pb.innerHTML += '⭐';
            }
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateChoices(correctAnswer, maxLimit) {
            let choices = new Set([correctAnswer]);
            while(choices.size < 3) {
                let r = getRandomInt(1, Math.max(correctAnswer + 3, maxLimit));
                if (r > 0) choices.add(r);
            }
            return Array.from(choices).sort(() => Math.random() - 0.5);
        }

        function initRound() {
            isAnimating = false;
            updateProgressBar();
            
            const qContainer = document.getElementById('question-container');
            const cContainer = document.getElementById('choices-container');
            qContainer.innerHTML = '';
            cContainer.innerHTML = '';

            // Random theme and emoji
            const themeKeys = Object.keys(themes);
            const randomTheme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
            const emojis = themes[randomTheme];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];

            // Determine difficulty
            let mode = 'counting';
            let maxCount = 5;

            if (correctCount >= 30) {
                mode = 'addition';
                maxCount = 10;
            } else if (correctCount >= 20) {
                maxCount = 10;
            } else if (correctCount >= 10) {
                maxCount = 8;
            }

            let correctAnswer = 0;

            if (mode === 'counting') {
                correctAnswer = getRandomInt(1, maxCount);
                for (let i = 0; i < correctAnswer; i++) {
                    const el = document.createElement('div');
                    el.className = 'object';
                    el.textContent = emoji;
                    el.style.animationDelay = `${i * 0.08}s`;
                    qContainer.appendChild(el);
                }
            } else {
                // Addition mode
                const a = getRandomInt(1, maxCount - 1);
                const b = getRandomInt(1, maxCount - a);
                correctAnswer = a + b;

                const g1 = document.createElement('div');
                g1.className = 'object-group';
                for(let i=0; i<a; i++) {
                    const el = document.createElement('div'); el.className = 'object'; el.textContent = emoji;
                    g1.appendChild(el);
                }
                
                const op = document.createElement('div');
                op.className = 'operator';
                op.textContent = '+';

                const g2 = document.createElement('div');
                g2.className = 'object-group';
                for(let i=0; i<b; i++) {
                    const el = document.createElement('div'); el.className = 'object'; el.textContent = emoji;
                    g2.appendChild(el);
                }

                qContainer.appendChild(g1);
                qContainer.appendChild(op);
                qContainer.appendChild(g2);
            }

            const choices = generateChoices(correctAnswer, mode === 'addition' ? 10 : maxCount);
            
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = c;
                btn.onclick = () => handleChoice(btn, c === correctAnswer);
                cContainer.appendChild(btn);
            });
        }

        function handleChoice(btn, isCorrect) {
            if (isAnimating) return;
            initAudio();

            if (isCorrect) {
                isAnimating = true;
                playSound('correct');
                spawnConfetti();
                btn.style.background = '#1dd1a1';
                btn.style.color = '#fff';
                btn.style.borderColor = '#10ac84';
                correctCount++;
                setTimeout(initRound, 1800);
            } else {
                playSound('wrong');
                btn.classList.add('shake');
                setTimeout(() => {
                    btn.classList.remove('shake');
                }, 500);
            }
        }

        document.body.addEventListener('click', initAudio, { once: true });
        
        initRound();
    </script>
</body>
</html>
