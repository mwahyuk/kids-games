<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menghitung Jari! 🔢</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #444;
        }

        #home-button {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 99999;
            text-decoration: none;
            font-size: 32px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }

        #home-button:active {
            transform: scale(0.9);
        }

        #progress-bar {
            margin-top: max(15px, env(safe-area-inset-top));
            font-size: clamp(24px, 4vw, 36px);
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            padding: 0 80px;
            z-index: 10;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin: 5px 0 15px;
            color: #ff6b6b;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            text-align: center;
            z-index: 10;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 10px 20px 30px;
            z-index: 10;
        }

        #question-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 36px;
            padding: 24px 34px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            margin-bottom: 30px;
            width: 100%;
            gap: 15px;
        }

        .object {
            font-size: clamp(48px, 10vw, 72px);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .operator {
            font-size: clamp(48px, 10vw, 72px);
            color: #4a69bd;
            font-weight: bold;
            margin: 0 15px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .object-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        #choices-container {
            display: flex;
            justify-content: center;
            gap: clamp(15px, 3vw, 30px);
            flex-wrap: wrap;
            width: 100%;
            max-width: 700px;
        }

        .choice-btn-3d {
            background: #fff;
            border: 4px solid #4a69bd;
            border-radius: 28px;
            width: clamp(95px, 20vw, 140px);
            height: clamp(95px, 20vw, 140px);
            font-size: clamp(42px, 8.5vw, 68px);
            font-family: 'Bubblegum Sans', cursive;
            color: #4a69bd;
            cursor: pointer;
            box-shadow: 0 8px 0 #3b5998, 0 12px 20px rgba(0,0,0,0.12);
            transition: all 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .choice-btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #3b5998, 0 4px 10px rgba(0,0,0,0.1);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

    <a href="index.html" id="home-button" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="progress-bar"></div>

    <h1>Menghitung Jari! 🔢</h1>

    <div id="game-area">
        <div id="question-container">
            <!-- Objects will be injected here -->
        </div>
        <div id="choices-container">
            <!-- Buttons will be injected here -->
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const themes = {
            buah: ['🍎', '🍊', '🍌', '🍓', '🍇', '🍉', '🍑', '🥝'],
            hewan: ['🐶', '🐱', '🐰', '🐸', '🦁', '🐻', '🐼', '🐨'],
            kendaraan: ['🚗', '🚌', '🚂', '✈️', '🚀', '🚲', '🚁', '🛸']
        };

        let correctCount = 0;
        let isAnimating = false;

        // Audio System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, index) => {
                        const oscWin = audioCtx.createOscillator();
                        const gainWin = audioCtx.createGain();
                        oscWin.connect(gainWin);
                        gainWin.connect(audioCtx.destination);
                        
                        oscWin.type = 'sine';
                        oscWin.frequency.setValueAtTime(freq, now + (index * 0.15));
                        
                        gainWin.gain.setValueAtTime(0, now + (index * 0.15));
                        gainWin.gain.linearRampToValueAtTime(0.4, now + (index * 0.15) + 0.05);
                        gainWin.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.15) + 0.4);
                        
                        oscWin.start(now + (index * 0.15));
                        oscWin.stop(now + (index * 0.15) + 0.4);
                    });
                }
            } catch(e) {}
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            particles = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#00bcd4', '#4CAF50', '#FFEB3B', '#FF9800'];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -12 - 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            requestAnimationFrame(renderConfetti);
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2;
                p.y += p.dy;
                p.x += p.dx;

                if (p.y <= canvas.height) {
                    active = true;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            }
            if (active) {
                requestAnimationFrame(renderConfetti);
            }
        }

        function generateQuestion() {
            const isAddition = Math.random() > 0.4;
            const themeKeys = Object.keys(themes);
            const selectedThemeKey = themeKeys[Math.floor(Math.random() * themeKeys.length)];
            const themeItems = themes[selectedThemeKey];
            const chosenItem = themeItems[Math.floor(Math.random() * themeItems.length)];

            let num1, num2, targetAnswer;
            let questionHTML = '';

            if (isAddition) {
                num1 = Math.floor(Math.random() * 4) + 1;
                num2 = Math.floor(Math.random() * 4) + 1;
                targetAnswer = num1 + num2;

                let group1 = `<div class="object-group">` + Array(num1).fill(`<span class="object">${chosenItem}</span>`).join('') + `</div>`;
                let operator = `<span class="operator">+</span>`;
                let group2 = `<div class="object-group">` + Array(num2).fill(`<span class="object">${chosenItem}</span>`).join('') + `</div>`;

                questionHTML = group1 + operator + group2;
            } else {
                targetAnswer = Math.floor(Math.random() * 6) + 1;
                let group = `<div class="object-group">` + Array(targetAnswer).fill(`<span class="object">${chosenItem}</span>`).join('') + `</div>`;
                questionHTML = group;
            }

            const questionContainer = document.getElementById('question-container');
            questionContainer.innerHTML = questionHTML;

            let choices = [targetAnswer];
            while (choices.length < 3) {
                let wrongChoice = Math.floor(Math.random() * 8) + 1;
                if (!choices.includes(wrongChoice)) {
                    choices.push(wrongChoice);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            choices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn-3d';
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val, targetAnswer, btn);
                choicesContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btnElement) {
            if (isAnimating) return;

            if (selected === correct) {
                isAnimating = true;
                playSound('correct');
                createConfetti();
                correctCount++;
                updateProgress();

                btnElement.style.background = '#4cd137';
                btnElement.style.color = '#fff';
                btnElement.style.borderColor = '#44bd32';

                setTimeout(() => {
                    isAnimating = false;
                    generateQuestion();
                }, 1200);
            } else {
                playSound('wrong');
                btnElement.classList.add('shake');
                btnElement.style.background = '#e74c3c';
                btnElement.style.color = '#fff';
                btnElement.style.borderColor = '#c0392b';

                setTimeout(() => {
                    btnElement.classList.remove('shake');
                    btnElement.style.background = '#fff';
                    btnElement.style.color = '#4a69bd';
                    btnElement.style.borderColor = '#4a69bd';
                }, 500);
            }
        }

        function updateProgress() {
            const progressBar = document.getElementById('progress-bar');
            progressBar.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('span');
                star.innerText = i < (correctCount % 5) ? '⭐' : '⚪';
                progressBar.appendChild(star);
            }

            if (correctCount > 0 && correctCount % 5 === 0) {
                playSound('win');
            }
        }

        updateProgress();
        generateQuestion();
    </script>
</body>
</html>
