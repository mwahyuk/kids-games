<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cocokkan Bentuknya!</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none; /* Prevent scroll */
        }

        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            text-decoration: none;
            z-index: 9999;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            transition: transform 0.2s;
            cursor: pointer;
        }
        #back-btn:active {
            transform: scale(0.9);
        }

        #header {
            text-align: center;
            margin-top: 15px;
        }

        h1 {
            font-size: 48px;
            color: #ff6b6b;
            margin: 0;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 4px 4px 8px rgba(0,0,0,0.2);
        }

        #stars-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .star {
            font-size: 40px;
            color: #ddd;
            transition: color 0.5s;
            filter: grayscale(100%);
        }
        .star.active {
            filter: grayscale(0%);
            text-shadow: 0 0 10px #ffea00;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        #targets, #draggables {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            flex: 1;
        }

        #targets {
            align-items: flex-end;
            padding-bottom: 40px;
        }

        #draggables {
            align-items: flex-start;
            padding-top: 40px;
        }

        .shape-container {
            width: 100px;
            height: 100px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target-slot {
            width: 90px;
            height: 90px;
            background-color: rgba(0,0,0,0.1);
            border: 4px dashed rgba(255,255,255,0.6);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }
        .target-slot.highlight {
            background-color: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        
        .target-shape {
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.15);
        }

        .draggable {
            width: 90px;
            height: 90px;
            position: absolute;
            cursor: grab;
            z-index: 10;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.3));
            transition: transform 0.1s;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .dragging {
            z-index: 1000;
            transition: none !important;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.4)) scale(1.1);
        }
        
        .shape-circle { border-radius: 50%; }
        .shape-square { border-radius: 15px; }
        .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .shape-star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .shape-diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .shape-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .shape-oval { border-radius: 50% / 100px 50px; height: 70px !important; margin-top: 10px; }
        .shape-heart {
            clip-path: path('M45 90 C 20 60, 0 35, 0 25 C 0 10, 10 0, 25 0 C 35 0, 42 5, 45 10 C 48 5, 55 0, 65 0 C 80 0, 90 10, 90 25 C 90 35, 70 60, 45 90 Z');
        }

        .anim-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .anim-bounce {
            transition: left 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                        top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) !important;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9000;
        }

        #tutorial-arrow {
            position: absolute;
            font-size: 60px;
            color: #ff6b6b;
            text-shadow: 2px 2px 0 #fff;
            pointer-events: none;
            z-index: 500;
            animation: pointArrow 1s infinite alternate;
            display: none;
        }

        @keyframes pointArrow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(15px, -15px); }
        }
        
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .msg {
            font-size: 100px;
            color: #ff6b6b;
            text-shadow: 4px 4px 0 #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            animation: popMsg 1s ease-out;
        }

        @keyframes popMsg {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <a id="back-btn" href="index.html">🏠</a>

    <div id="header">
        <h1>Cocokkan Bentuknya!</h1>
        <div id="stars-container">
            <div class="star" id="star-1">⭐</div>
            <div class="star" id="star-2">⭐</div>
            <div class="star" id="star-3">⭐</div>
            <div class="star" id="star-4">⭐</div>
        </div>
    </div>

    <div id="game-area">
        <div id="targets"></div>
        <div id="draggables"></div>
    </div>

    <div id="tutorial-arrow">👆</div>

    <canvas id="confetti-canvas"></canvas>

    <div id="celebration-overlay" class="overlay">
        <div class="msg">Hebat! 🎉</div>
    </div>

    <script>
        // Sound System
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'ding') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'yeay') {
                osc.type = 'sine';
                
                // Arpeggio
                const notes = [440, 554, 659, 880]; // A4, C#5, E5, A5
                const noteLen = 0.1;
                
                for(let i=0; i<notes.length; i++) {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.type = 'sine';
                    o.frequency.value = notes[i];
                    
                    const start = ctx.currentTime + (i * noteLen);
                    g.gain.setValueAtTime(0, start);
                    g.gain.linearRampToValueAtTime(0.3, start + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.01, start + noteLen * 2);
                    
                    o.start(start);
                    o.stop(start + noteLen * 2);
                }
            }
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettiAnimationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            particles = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            
            if (!confettiAnimationId) {
                renderConfetti();
            }
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // gravity
                p.y += p.dy;
                p.x += p.dx;
                
                if (p.y <= canvas.height) {
                    active = true;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            }
            
            if (active) {
                confettiAnimationId = requestAnimationFrame(renderConfetti);
            } else {
                confettiAnimationId = null;
            }
        }

        // Game Variables
        const ALL_SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'hexagon', 'oval', 'heart'];
        const ALL_COLORS = ['#ff4757', '#1e90ff', '#2ed573', '#eccc68', '#ff7f50', '#9b59b6', '#00cec9', '#ffa502'];
        const LEVEL_COUNTS = [3, 4, 5, 6];
        let currentLevel = 1;
        let matchedCount = 0;
        let currentLevelShapes = [];
        let draggingElement = null;
        let originalPos = { x: 0, y: 0 };
        let offset = { x: 0, y: 0 };

        const targetsDiv = document.getElementById('targets');
        const draggablesDiv = document.getElementById('draggables');
        const tutorialArrow = document.getElementById('tutorial-arrow');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            currentLevel = 1;
            loadLevel();
        }

        function loadLevel() {
            matchedCount = 0;
            targetsDiv.innerHTML = '';
            draggablesDiv.innerHTML = '';
            tutorialArrow.style.display = 'none';
            
            // Update Stars
            for(let i=1; i<=4; i++) {
                document.getElementById(`star-${i}`).classList.remove('active');
            }
            for(let i=1; i<=currentLevel; i++) {
                document.getElementById(`star-${i}`).classList.add('active');
            }

            const shapeCount = LEVEL_COUNTS[currentLevel - 1];
            
            // Pick random shapes and colors
            let shapesPool = shuffle([...ALL_SHAPES]);
            let colorsPool = shuffle([...ALL_COLORS]);
            
            currentLevelShapes = [];
            for (let i = 0; i < shapeCount; i++) {
                currentLevelShapes.push({
                    type: shapesPool[i],
                    color: colorsPool[i]
                });
            }

            // Create Targets
            currentLevelShapes.forEach(shape => {
                const container = document.createElement('div');
                container.className = 'shape-container';
                
                const slot = document.createElement('div');
                slot.className = `target-slot target-${shape.type}`;
                slot.dataset.type = shape.type;
                
                const inner = document.createElement('div');
                inner.className = `target-shape shape-${shape.type}`;
                slot.appendChild(inner);
                
                container.appendChild(slot);
                targetsDiv.appendChild(container);
            });

            // Create Draggables (Shuffled)
            let shuffledShapes = shuffle([...currentLevelShapes]);
            
            shuffledShapes.forEach(shape => {
                const container = document.createElement('div');
                container.className = 'shape-container';
                
                const drag = document.createElement('div');
                drag.className = `draggable shape-${shape.type}`;
                drag.dataset.type = shape.type;
                drag.style.backgroundColor = shape.color;
                
                // Event Listeners
                drag.addEventListener('mousedown', startDrag);
                drag.addEventListener('touchstart', startDrag, {passive: false});
                
                container.appendChild(drag);
                draggablesDiv.appendChild(container);
            });

            if (currentLevel === 1) {
                setTimeout(showTutorial, 1000);
            }
        }

        function showTutorial() {
            if (matchedCount > 0) return;
            const firstDrag = document.querySelector('.draggable');
            if (!firstDrag) return;
            
            const rect = firstDrag.getBoundingClientRect();
            tutorialArrow.style.display = 'block';
            tutorialArrow.style.left = `${rect.left + rect.width/2}px`;
            tutorialArrow.style.top = `${rect.top + rect.height/2}px`;
        }

        // Drag Logic
        function startDrag(e) {
            if (e.type === 'touchstart') e.preventDefault();
            
            tutorialArrow.style.display = 'none';
            playSound('pop');
            
            draggingElement = this;
            draggingElement.classList.add('dragging');
            draggingElement.classList.remove('anim-bounce');
            
            const rect = draggingElement.getBoundingClientRect();
            
            originalPos = {
                left: draggingElement.style.left || '0px',
                top: draggingElement.style.top || '0px',
                parent: draggingElement.parentElement
            };

            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            offset.x = clientX - rect.left;
            offset.y = clientY - rect.top;

            // Move to body so it floats above everything
            document.body.appendChild(draggingElement);
            
            moveElement(clientX, clientY);

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!draggingElement) return;
            if (e.type === 'touchmove') e.preventDefault();
            
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            moveElement(clientX, clientY);
            
            // Highlight target
            document.querySelectorAll('.target-slot').forEach(slot => slot.classList.remove('highlight'));
            const target = getDropTarget(clientX, clientY);
            if (target && target.dataset.type === draggingElement.dataset.type) {
                target.classList.add('highlight');
            }
        }

        function moveElement(x, y) {
            draggingElement.style.left = `${x - offset.x}px`;
            draggingElement.style.top = `${y - offset.y}px`;
        }

        function stopDrag(e) {
            if (!draggingElement) return;
            
            const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;
            
            const target = getDropTarget(clientX, clientY);
            document.querySelectorAll('.target-slot').forEach(slot => slot.classList.remove('highlight'));
            
            if (target && target.dataset.type === draggingElement.dataset.type && !target.hasChildNodes()) {
                // Correct Match
                playSound('ding');
                
                draggingElement.classList.remove('dragging');
                draggingElement.style.left = '0';
                draggingElement.style.top = '0';
                draggingElement.style.position = 'relative';
                
                // Clear the dummy inner shape
                target.innerHTML = '';
                target.appendChild(draggingElement);
                
                draggingElement.classList.add('anim-pop');
                draggingElement.removeEventListener('mousedown', startDrag);
                draggingElement.removeEventListener('touchstart', startDrag);
                
                draggingElement = null;
                matchedCount++;
                
                checkLevelComplete();
            } else {
                // Wrong Match
                playSound('wrong');
                draggingElement.classList.remove('dragging');
                draggingElement.classList.add('anim-bounce');
                
                originalPos.parent.appendChild(draggingElement);
                draggingElement.style.left = originalPos.left;
                draggingElement.style.top = originalPos.top;
                
                setTimeout(() => {
                    if(draggingElement) {
                        draggingElement.classList.remove('anim-bounce');
                    }
                    draggingElement = null;
                }, 500);
            }
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function getDropTarget(x, y) {
            const elements = document.elementsFromPoint(x, y);
            for (let el of elements) {
                if (el.classList.contains('target-slot')) {
                    return el;
                }
            }
            return null;
        }

        function checkLevelComplete() {
            if (matchedCount === LEVEL_COUNTS[currentLevel - 1]) {
                playSound('yeay');
                createConfetti();
                
                const overlay = document.getElementById('celebration-overlay');
                setTimeout(() => {
                    overlay.classList.add('show');
                }, 1000);
                
                setTimeout(() => {
                    overlay.classList.remove('show');
                    currentLevel++;
                    if (currentLevel > 4) {
                        currentLevel = 1;
                    }
                    loadLevel();
                }, 3500);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
