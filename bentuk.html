<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mencocokkan Bentuk! 🔷</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/jpeg" href="icons/app-icon.jpg">
    <link rel="apple-touch-icon" href="icons/app-icon.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Bubblegum Sans', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        /* PWA Accessible Home Button */
        #back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 99999;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            cursor: pointer;
            pointer-events: auto;
        }
        #back-btn:active {
            transform: scale(0.9);
        }

        #header {
            text-align: center;
            padding-top: max(15px, env(safe-area-inset-top));
            padding-bottom: 5px;
            z-index: 10;
        }

        h1 {
            font-size: clamp(28px, 5vw, 48px);
            color: #ff6b6b;
            margin: 0;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 4px 4px 8px rgba(0,0,0,0.15);
        }

        #stars-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .star {
            font-size: clamp(28px, 4vw, 40px);
            color: #ddd;
            transition: color 0.5s;
            filter: grayscale(100%);
        }
        .star.active {
            filter: grayscale(0%);
            text-shadow: 0 0 10px #ffea00;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 15px;
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        @media (orientation: landscape) and (min-height: 400px) {
            #game-area {
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
            }
            #targets {
                align-items: center !important;
            }
            #draggables {
                align-items: center !important;
            }
        }

        #targets, #draggables {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: clamp(12px, 3.5vw, 28px);
            width: 100%;
            max-width: 750px;
        }

        .shape-container {
            width: clamp(80px, 13vw, 120px);
            height: clamp(80px, 13vw, 120px);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target-slot {
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.4);
            border: 4px dashed rgba(255,107,107,0.6);
            border-radius: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.08);
        }
        .target-slot.highlight {
            background-color: rgba(255,255,255,0.85);
            transform: scale(1.1);
            border-color: #00b894;
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.4);
        }
        
        .target-shape-svg {
            width: 75%;
            height: 75%;
            opacity: 0.25;
            filter: grayscale(100%);
        }

        .draggable {
            width: 85%;
            height: 85%;
            position: absolute;
            cursor: grab;
            z-index: 10;
            filter: drop-shadow(0px 8px 14px rgba(0,0,0,0.22));
            transition: transform 0.1s;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .draggable svg {
            width: 100%;
            height: 100%;
        }
        .dragging {
            z-index: 1000 !important;
            transition: none !important;
            filter: drop-shadow(0px 16px 25px rgba(0,0,0,0.35));
            pointer-events: none;
        }

        .anim-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .anim-bounce {
            transition: left 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                        top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) !important;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9000;
        }

        #tutorial-arrow {
            position: absolute;
            font-size: 50px;
            color: #ff6b6b;
            text-shadow: 2px 2px 0 #fff;
            pointer-events: none;
            z-index: 500;
            animation: pointArrow 1s infinite alternate;
            display: none;
        }

        @keyframes pointArrow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(15px, -15px); }
        }
        
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .msg {
            font-size: clamp(60px, 12vw, 100px);
            color: #ff6b6b;
            text-shadow: 4px 4px 0 #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            animation: popMsg 0.8s ease-out;
        }

        @keyframes popMsg {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <a id="back-btn" href="index.html" onclick="window.location.href='index.html'; return true;">🏠</a>

    <div id="header">
        <h1>Mencocokkan Bentuk! 🔷</h1>
        <div id="stars-container">
            <div class="star" id="star-1">⭐</div>
            <div class="star" id="star-2">⭐</div>
            <div class="star" id="star-3">⭐</div>
            <div class="star" id="star-4">⭐</div>
        </div>
    </div>

    <div id="game-area">
        <div id="targets"></div>
        <div id="draggables"></div>
    </div>

    <div id="tutorial-arrow">👆</div>

    <canvas id="confetti-canvas"></canvas>

    <div id="celebration-overlay" class="overlay">
        <div class="msg">Hebat! 🎉</div>
    </div>

    <script>
        // 3D Glossy Vector SVG Generators
        const SHAPE_SVGS = {
            circle: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <radialGradient id="grad-circle-${color.replace('#','')}" cx="35%" cy="30%" r="65%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                            <stop offset="30%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#2d3436"/>
                        </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="44" fill="url(#grad-circle-${color.replace('#','')})" stroke="#2d3436" stroke-width="4"/>
                    <ellipse cx="38" cy="32" rx="12" ry="7" fill="#ffffff" opacity="0.65"/>
                </svg>`,
            square: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="grad-sq-${color.replace('#','')}" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
                            <stop offset="40%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#1e272e"/>
                        </linearGradient>
                    </defs>
                    <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#grad-sq-${color.replace('#','')})" stroke="#2d3436" stroke-width="4"/>
                    <path d="M 18 20 L 82 20 C 82 20 70 34 20 34 Z" fill="#ffffff" opacity="0.45"/>
                </svg>`,
            triangle: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="grad-tri-${color.replace('#','')}" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                            <stop offset="50%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#2d3436"/>
                        </linearGradient>
                    </defs>
                    <polygon points="50,6 94,90 6,90" fill="url(#grad-tri-${color.replace('#','')})" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,14 78,80 22,80" fill="#ffffff" opacity="0.3"/>
                </svg>`,
            star: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <radialGradient id="grad-star-${color.replace('#','')}" cx="40%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="40%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#d4af37"/>
                        </radialGradient>
                    </defs>
                    <path d="M 50 5 L 63 35 L 96 38 L 71 61 L 78 94 L 50 77 L 22 94 L 29 61 L 4 38 L 37 35 Z" fill="url(#grad-star-${color.replace('#','')})" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="38" cy="32" r="6" fill="#ffffff" opacity="0.7"/>
                </svg>`,
            diamond: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="grad-dia-${color.replace('#','')}" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                            <stop offset="50%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#1e272e"/>
                        </linearGradient>
                    </defs>
                    <polygon points="50,6 94,50 50,94 6,50" fill="url(#grad-dia-${color.replace('#','')})" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,14 78,50 50,86 22,50" fill="#ffffff" opacity="0.3"/>
                </svg>`,
            heart: (color) => `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <radialGradient id="grad-heart-${color.replace('#','')}" cx="35%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="40%" stop-color="${color}"/>
                            <stop offset="100%" stop-color="#800000"/>
                        </radialGradient>
                    </defs>
                    <path d="M 50 88 C 20 60, 4 38, 4 24 C 4 10, 16 2, 30 2 C 40 2, 47 8, 50 14 C 53 8, 60 2, 70 2 C 84 2, 96 10, 96 24 C 96 38, 80 60, 50 88 Z" fill="url(#grad-heart-${color.replace('#','')})" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
                    <ellipse cx="30" cy="20" rx="8" ry="5" fill="#ffffff" opacity="0.75"/>
                </svg>`
        };

        // Audio System
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'ding') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'wrong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'yeay') {
                    const notes = [440, 554, 659, 880];
                    const noteLen = 0.1;
                    
                    for(let i=0; i<notes.length; i++) {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.value = notes[i];
                        
                        const start = ctx.currentTime + (i * noteLen);
                        g.gain.setValueAtTime(0, start);
                        g.gain.linearRampToValueAtTime(0.3, start + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.01, start + noteLen * 2);
                        
                        o.start(start);
                        o.stop(start + noteLen * 2);
                    }
                }
            } catch (e) {}
        }

        // Confetti System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettiAnimationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            particles = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#00bcd4', '#4CAF50', '#FFEB3B', '#FF9800'];
            
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            
            if (!confettiAnimationId) {
                renderConfetti();
            }
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2;
                p.y += p.dy;
                p.x += p.dx;
                
                if (p.y <= canvas.height) {
                    active = true;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            }
            
            if (active) {
                confettiAnimationId = requestAnimationFrame(renderConfetti);
            } else {
                confettiAnimationId = null;
            }
        }

        // Game Variables
        const ALL_SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'heart'];
        const ALL_COLORS = ['#ff4757', '#1e90ff', '#2ed573', '#f1c40f', '#ff7f50', '#9b59b6'];
        const LEVEL_COUNTS = [3, 4, 5, 6];
        let currentLevel = 1;
        let matchedCount = 0;
        let currentLevelShapes = [];
        let draggingElement = null;
        let originalPos = { left: '0px', top: '0px', parent: null };
        let offset = { x: 0, y: 0 };

        const targetsDiv = document.getElementById('targets');
        const draggablesDiv = document.getElementById('draggables');
        const tutorialArrow = document.getElementById('tutorial-arrow');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            currentLevel = 1;
            loadLevel();
        }

        function loadLevel() {
            matchedCount = 0;
            targetsDiv.innerHTML = '';
            draggablesDiv.innerHTML = '';
            tutorialArrow.style.display = 'none';
            
            for(let i=1; i<=4; i++) {
                document.getElementById(`star-${i}`).classList.remove('active');
            }
            for(let i=1; i<=currentLevel; i++) {
                document.getElementById(`star-${i}`).classList.add('active');
            }

            const shapeCount = LEVEL_COUNTS[currentLevel - 1];
            
            let shapesPool = shuffle([...ALL_SHAPES]);
            let colorsPool = shuffle([...ALL_COLORS]);
            
            currentLevelShapes = [];
            for (let i = 0; i < shapeCount; i++) {
                currentLevelShapes.push({
                    type: shapesPool[i],
                    color: colorsPool[i]
                });
            }

            // Create 3D Target Slots
            currentLevelShapes.forEach(shape => {
                const container = document.createElement('div');
                container.className = 'shape-container';
                
                const slot = document.createElement('div');
                slot.className = `target-slot target-${shape.type}`;
                slot.dataset.type = shape.type;
                
                const inner = document.createElement('div');
                inner.className = `target-shape-svg`;
                inner.innerHTML = SHAPE_SVGS[shape.type]('#333333');
                slot.appendChild(inner);
                
                container.appendChild(slot);
                targetsDiv.appendChild(container);
            });

            // Create Draggables with 3D Glossy Vector SVGs
            let shuffledShapes = shuffle([...currentLevelShapes]);
            
            shuffledShapes.forEach(shape => {
                const container = document.createElement('div');
                container.className = 'shape-container';
                
                const drag = document.createElement('div');
                drag.className = `draggable`;
                drag.dataset.type = shape.type;
                drag.innerHTML = SHAPE_SVGS[shape.type](shape.color);
                
                drag.addEventListener('mousedown', startDrag);
                drag.addEventListener('touchstart', startDrag, {passive: false});
                
                container.appendChild(drag);
                draggablesDiv.appendChild(container);
            });

            if (currentLevel === 1) {
                setTimeout(showTutorial, 800);
            }
        }

        function showTutorial() {
            if (matchedCount > 0) return;
            const firstDrag = document.querySelector('.draggable');
            if (!firstDrag) return;
            
            const rect = firstDrag.getBoundingClientRect();
            tutorialArrow.style.display = 'block';
            tutorialArrow.style.left = `${rect.left + rect.width/2}px`;
            tutorialArrow.style.top = `${rect.top + rect.height/2}px`;
        }

        // Drag Logic
        function startDrag(e) {
            if (e.type === 'touchstart') e.preventDefault();
            
            tutorialArrow.style.display = 'none';
            playSound('pop');
            
            draggingElement = this;
            draggingElement.classList.add('dragging');
            draggingElement.classList.remove('anim-bounce');
            
            const rect = draggingElement.getBoundingClientRect();
            
            originalPos = {
                left: draggingElement.style.left || '0px',
                top: draggingElement.style.top || '0px',
                parent: draggingElement.parentElement
            };

            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            offset.x = clientX - rect.left;
            offset.y = clientY - rect.top;

            // PRESERVE EXPLICIT WIDTH & HEIGHT TO PREVENT SHAPE RESIZING
            draggingElement.style.width = `${rect.width}px`;
            draggingElement.style.height = `${rect.height}px`;

            document.body.appendChild(draggingElement);
            draggingElement.style.position = 'fixed';
            
            moveElement(clientX, clientY);

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!draggingElement) return;
            if (e.type === 'touchmove') e.preventDefault();
            
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            moveElement(clientX, clientY);
            
            // Highlight matching target if within drop threshold
            document.querySelectorAll('.target-slot').forEach(slot => slot.classList.remove('highlight'));
            const target = findBestMatchingTarget(draggingElement);
            if (target) {
                target.classList.add('highlight');
            }
        }

        function moveElement(x, y) {
            draggingElement.style.left = `${x - offset.x}px`;
            draggingElement.style.top = `${y - offset.y}px`;
        }

        function stopDrag(e) {
            if (!draggingElement) return;
            
            const target = findBestMatchingTarget(draggingElement);
            document.querySelectorAll('.target-slot').forEach(slot => slot.classList.remove('highlight'));
            
            if (target) {
                // Correct Match!
                playSound('ding');
                target.dataset.matched = 'true';
                
                draggingElement.classList.remove('dragging');
                draggingElement.style.left = '0';
                draggingElement.style.top = '0';
                draggingElement.style.position = 'relative';
                draggingElement.style.width = '85%';
                draggingElement.style.height = '85%';
                
                target.innerHTML = '';
                target.appendChild(draggingElement);
                
                draggingElement.classList.add('anim-pop');
                draggingElement.removeEventListener('mousedown', startDrag);
                draggingElement.removeEventListener('touchstart', startDrag);
                
                draggingElement = null;
                matchedCount++;
                
                checkLevelComplete();
            } else {
                // Wrong Match or Dropped far away -> Return to original box
                playSound('wrong');
                draggingElement.classList.remove('dragging');
                draggingElement.classList.add('anim-bounce');
                
                draggingElement.style.width = '85%';
                draggingElement.style.height = '85%';

                originalPos.parent.appendChild(draggingElement);
                draggingElement.style.position = 'absolute';
                draggingElement.style.left = originalPos.left;
                draggingElement.style.top = originalPos.top;
                
                setTimeout(() => {
                    if(draggingElement) {
                        draggingElement.classList.remove('anim-bounce');
                    }
                    draggingElement = null;
                }, 400);
            }
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        // ACCURATE FORGIVING DISTANCE MATCHING FOR KIDS
        function findBestMatchingTarget(dragEl) {
            const dragRect = dragEl.getBoundingClientRect();
            const dragCenter = {
                x: dragRect.left + dragRect.width / 2,
                y: dragRect.top + dragRect.height / 2
            };
            
            let bestTarget = null;
            let minDistance = Infinity;
            const threshold = Math.max(dragRect.width, dragRect.height) * 1.1;

            document.querySelectorAll('.target-slot').forEach(slot => {
                if (slot.dataset.matched) return;
                if (slot.dataset.type !== dragEl.dataset.type) return;

                const slotRect = slot.getBoundingClientRect();
                const slotCenter = {
                    x: slotRect.left + slotRect.width / 2,
                    y: slotRect.top + slotRect.height / 2
                };
                const dist = Math.hypot(dragCenter.x - slotCenter.x, dragCenter.y - slotCenter.y);
                if (dist < threshold && dist < minDistance) {
                    minDistance = dist;
                    bestTarget = slot;
                }
            });

            return bestTarget;
        }

        function checkLevelComplete() {
            if (matchedCount === LEVEL_COUNTS[currentLevel - 1]) {
                playSound('yeay');
                createConfetti();
                
                const overlay = document.getElementById('celebration-overlay');
                setTimeout(() => {
                    overlay.classList.add('show');
                }, 400);
                
                setTimeout(() => {
                    overlay.classList.remove('show');
                    currentLevel++;
                    if (currentLevel > 4) {
                        currentLevel = 1;
                    }
                    loadLevel();
                }, 2800);
            }
        }

        window.onload = initGame;
    </script>
</body>
